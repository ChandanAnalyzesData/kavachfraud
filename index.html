ickly so banks and exchanges can freeze funds","Banks should watch accounts that receive many small UPI credits and buy USDT in bulk on P2P platforms"],rails:["P2P Cryptocurrency (USDT)","UPI VPAs","Mule Accounts","Sideloaded APKs"],targets:["Retail investors","Salaried professionals","Crypto beginners","Social media users"],media:{type:"audio",title:"Reconstructed Chat Call \xB7 Fake USDT Arbitrage Platform",duration:56,transcript:[{time:0,speaker:"Scammer (Fake Crypto Advisor)",text:"Our USDT arbitrage platform earns daily profit by buying on one exchange and selling on another. Deposit USDT to our wallet and earn two percent a day."},{time:15,speaker:"Victim",text:"I invested \u20B910 lakh. The dashboard shows a profit, but I cannot withdraw."},{time:25,speaker:"Scammer (Fake Support Agent)",text:"Withdrawals need a verification fee of ten percent and a tax payment. After that everything is released."},{time:38,speaker:"Victim",text:"I paid, and now it asks for another fee."},{time:46,speaker:"Scammer (Fake Support Agent)",text:"Refer new members to move your account up and unlock withdrawal faster."},{time:53,speaker:"Genuine Cyber Police Officer",text:"Do not send more money. Note the wallet addresses and transaction hashes and report on 1930 so that exchanges and banks can freeze the funds."}],iocs:{fake_platforms:["usdt-arbitrage-hub[.]vip (illustrative)","Staking app distributed as an APK (illustrative)"],wallets:["TRC-20 USDT: TXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX (masked)"],mule_and_p2p:["Bank accounts used to collect UPI deposits","Cash converted to USDT through P2P dealers"],handles:["Telegram: '@USDT_Arbitrage_Desk' (illustrative)","WhatsApp support numbers that rotate"]},legal_statutes:["BNS Sec 318(4) (Cheating)","BNS Sec 111 (Organised crime)","IT Act Sec 66D (Cheating by personation using a computer resource)","Prevention of Money Laundering Act, 2002 Sec 3 (Laundering through crypto conversion)","Prize Chits and Money Circulation Schemes (Banning) Act, 1978 (Where earlier payouts rely on recruitment)"]}},{id:"IN-029",vector:"E-commerce Fraud",severity:"medium",title:"Fake rental listings: token advance for a flat that is not theirs",summary:"A listing on OLX, Facebook Marketplace or a property portal shows a flat at below-market rent. The 'owner' is abroad or busy, shares forged documents and asks for a token, advance rent or registration fee on UPI before any visit, then vanishes.",red_flags:["Rent far below the area average and attractive, often stolen, photos","Owner is 'abroad', 'on duty' or 'in the army' and cannot show the flat, but wants a token to 'block' it","Forged ID, rental agreement or ownership papers sent digitally over WhatsApp or Telegram","Payment requested to a personal UPI ID or account, and the listing disappears after payment"],control_points:["Never pay a token, deposit or fee before visiting the flat and meeting the real owner","Verify ownership with the society, the property tax record or the neighbours, and sign the agreement in person","Report the listing to the platform's grievance officer and the fraud to 1930 and cybercrime.gov.in","Platforms should verify owners and take down listings quickly after a complaint"],rails:["UPI VPAs","UPI QR Codes","Mule Accounts"],targets:["Students and job movers","Newly transferred employees","Migrant workers","Small business owners"],media:{type:"audio",title:"Reconstructed Call \xB7 'Owner Abroad' Token Advance",duration:55,transcript:[{time:0,speaker:"Scammer (Fake Landlord)",text:"Yes, the two-bedroom flat is available at \u20B914,000. I am on duty out of town, so I cannot show it. Many people want it."},{time:12,speaker:"Victim",text:"Can I visit this weekend and then pay the deposit?"},{time:19,speaker:"Scammer (Fake Landlord)",text:"Please pay \u20B920,000 token now to block it. I will send my ID and the agreement on WhatsApp, and my manager will give you the keys."},{time:33,speaker:"Victim",text:"I have paid the token. Where do I meet your manager?"},{time:42,speaker:"Scammer (Fake Landlord)",text:"The registration fee is also pending. Pay \u20B98,000 more today or I will give the flat to another family."},{time:52,speaker:"Genuine Cyber Police Officer",text:"Do not pay more. Report on 1930 with the UPI details and screenshots, and ask the listing platform to take the advertisement down."}],iocs:{listing_artifacts:["Below-market rent and photos copied from a real-estate site","Listing that disappears within 48 hours of payment"],documents:["Forged ID and rental agreement sent as images","Fake ownership papers"],payment_handles:["rent.token.advance@okaxis (illustrative)","Multiple bank accounts used to receive tokens"],contact_patterns:["Communication only on WhatsApp or Telegram","Owner 'abroad' or 'on duty'"]},legal_statutes:["BNS Sec 318(4) (Cheating)","BNS Sec 319(2) (Cheating by personation)","BNS Sec 336 (Forgery; forged documents)","IT Act Sec 66D (Cheating by personation using a computer resource)","Information Technology (Intermediary Guidelines) Rules, 2021 (Platform grievance officer and takedown duties)"]}},{id:"IN-030",vector:"E-commerce Fraud",severity:"high",title:"Fake hotel, homestay and travel booking sites targeting tourists",summary:"Lookalike websites or social media posts copy a hotel or booking portal, list a 'reception' number, and take an advance by UPI. Travellers arrive to find no booking. Fake flight and helicopter portals work the same way.",red_flags:["A website or Facebook post that looks like the hotel's own, but its phone number is not on the hotel's official site","Demand to pay the full amount in one UPI transfer to a personal or merchant account, citing 'technical issues'","Booking confirmation by email or WhatsApp with branded images but no booking ID on the hotel's system","Prices far below the usual rate during peak seasons, festivals or yatras"],control_points:["Book through the hotel's official website, a known portal's app, or call the property on the number from a trusted source","Confirm the booking by calling the hotel's front desk before paying","Use a card or portal payment that allows disputes, and avoid UPI transfers to personal accounts","Report fake sites on cybercrime.gov.in and 1930; police can block domains quickly"],rails:["UPI VPAs","UPI QR Codes","Mule Accounts","Unregistered Gateways"],targets:["Tourists and pilgrims","Families planning holidays","Corporate travellers"],media:{type:"audio",title:"Reconstructed Call \xB7 Fake 'Reception Manager' for a Resort Booking",duration:55,transcript:[{time:0,speaker:"Scammer (Fake Reception Manager)",text:"Welcome to the resort reservations desk. The deluxe room is available for your dates. A full advance payment confirms the booking."},{time:13,speaker:"Victim",text:"Can I pay half now and half at check-in?"},{time:21,speaker:"Scammer (Fake Reception Manager)",text:"Split payments are not working today because of a technical issue. Please pay the full \u20B933,000 in one UPI payment."},{time:34,speaker:"Victim",text:"I have paid. I got a confirmation message, but no booking number from the hotel."},{time:44,speaker:"Scammer (Fake Reception Manager)",text:"It will come within two hours. We also need a refundable security deposit, please send \u20B95,000 more."},{time:54,speaker:"Genuine Cyber Police Officer",text:"Stop paying and call the hotel on the number from its official site. If no booking exists, report on 1930 at once."}],iocs:{fake_domains:["luxury-resort-goa-booking[.]online (illustrative pattern)","irctc-heliyatra-style lookalike domains"],phone_numbers:["+91 91XXX 63XXX listed as 'reception' on the fake site"],payment_pattern:["Single UPI payment to a merchant account in another state","Domain registered with false details"],content_artifacts:["AI-generated or stolen room photos","Branded confirmation email without a booking ID"]},legal_statutes:["BNS Sec 318(4) (Cheating)","BNS Sec 319(2) (Cheating by personation)","BNS Sec 336 (Forgery; fake websites and confirmations)","IT Act Sec 66D (Cheating by personation using a computer resource)","Consumer Protection Act, 2019 Sec 2(47) (Unfair trade practice)"]}},{id:"IN-031",vector:"E-commerce Fraud",severity:"medium",title:"'India Post' and courier redelivery fee smishing",summary:"An SMS says a parcel is stuck at a warehouse because of an incomplete address and gives 12 to 48 hours to update it on a link. The page asks for personal details and a small redelivery fee, then captures card details or UPI credentials.",red_flags:["SMS or iMessage from a personal number or email-style sender about a parcel you did not expect","'Incomplete address' wording with a 12, 24 or 48-hour deadline","Link on a strange domain such as .top or .vip, not on the postal or courier official site","Page asks for a small fee and then your card number, CVV or UPI PIN"],control_points:["India Post does not ask customers to update addresses or pay fees by SMS links; track parcels on its official site or app","Do not click; delete the message and report it on 1930, cybercrime.gov.in and PIB Fact Check","If you entered card details, block the card and tell your bank immediately","Telecom operators should block repeat sender IDs and domains once reported"],rails:["UPI VPAs","Card (OTP phishing)","Unregistered Gateways"],targets:["Online shoppers","Senior citizens","General mobile users"],media:{type:"audio",title:"Reconstructed Call \xB7 Follow-up on a Fake Redelivery SMS",duration:52,transcript:[{time:0,speaker:"Scammer (Fake Delivery Executive)",text:"This is the postal delivery desk. Your parcel is held at the warehouse because the address is incomplete. Please update it on the link within twelve hours."},{time:14,speaker:"Victim",text:"I did not order anything. Why is there a fee?"},{time:21,speaker:"Scammer (Fake Delivery Executive)",text:"It is only \u20B925 for redelivery. Enter your card details on the page to pay and the parcel will come tomorrow."},{time:33,speaker:"Victim",text:"I paid, and now I got an OTP for \u20B938,000."},{time:42,speaker:"Scammer (Fake Delivery Executive)",text:"That is only a test code. Please read it so that the redelivery can be confirmed."},{time:50,speaker:"Genuine Bank Officer",text:"Do not share that OTP. Block your card now and report this on 1930."}],iocs:{sms_artifacts:["'Your package has arrived at the warehouse... incomplete address information'","Link on lookalike domains, for example indiapost-xxxx[.]vip (illustrative)"],sender_patterns:["Sender is a mobile number or email address, not a registered header"],payment_pattern:["Small fee followed by an OTP for a much larger charge"],impersonated_bodies:["India Post","Courier companies"]},legal_statutes:["BNS Sec 318(4) (Cheating)","BNS Sec 319(2) (Cheating by personation)","IT Act Sec 66C \xB7 66D (Identity theft; cheating by personation)","IT Act Sec 43 (Unauthorised access; data theft)","RBI customer-liability circular, 6 July 2017 (Report unauthorised transactions within three working days)"]}},{id:"IN-032",vector:"E-commerce Fraud",severity:"medium",title:"Fake pet and puppy sellers: reservation money, then 'insurance', 'licence' and 'delivery' fees",summary:"Social media ads or a seller's phone number promise a rare breed at an attractive price. After a reservation payment, the seller keeps adding insurance, breeder's licence, transport and 'home delivery' fees, and then blocks the buyer without sending any animal.",red_flags:["Rare breed offered cheaply or with 'free delivery' through Facebook, Instagram or WhatsApp","Seller refuses video calls or a visit and sends stock photos","Repeated fees for insurance, licence, crate, transport or 'customs'","Threats or sudden silence when you ask for delivery or a refund"],control_points:["Never pay for a pet you have not seen in person; insist on a live video or a visit","Check the breeder's registration and ask for local references or a vet's contact","Do not pay any extra 'delivery' or 'licence' fees; stop and report on 1930 with your payment details","Report the social media page to the platform so more buyers are not caught"],rails:["UPI VPAs","UPI QR Codes","Direct IMPS Transfers"],targets:["Pet lovers","Families buying a puppy","First-time pet owners"],media:{type:"audio",title:"Reconstructed Call \xB7 Puppy Seller and the Growing Fees",duration:52,transcript:[{time:0,speaker:"Scammer (Fake Pet Seller)",text:"Yes, the Husky puppy is available for \u20B930,000 only. Pay \u20B915,000 reservation and I will send it to your city."},{time:12,speaker:"Victim",text:"Can I see the puppy on a video call first?"},{time:19,speaker:"Scammer (Fake Pet Seller)",text:"The puppy is at our kennel with no network. I am sending photos. Many people are waiting, so please pay the reservation now."},{time:31,speaker:"Victim",text:"I paid, and now you want \u20B912,000 for insurance and \u20B910,000 for a breeder's licence?"},{time:41,speaker:"Scammer (Fake Pet Seller)",text:"These are government rules. Pay today or your puppy will be given away and the reservation money will be forfeited."},{time:50,speaker:"Genuine Cyber Police Officer",text:"Stop paying. Save the chats and the payment details, and report on 1930."}],iocs:{ad_artifacts:["Facebook or Instagram page with stolen puppy photos","Rare breed at less than half the usual price"],contact_patterns:["Refuses video calls","Phone switched off after repeated fee demands"],payment_handles:["pupkennel.reserve@ybl (illustrative)","Multiple personal accounts used for 'insurance' and 'licence'"],seller_artifacts:["Seller located in a different state from the pet's 'kennel'"]},legal_statutes:["BNS Sec 318(4) (Cheating)","BNS Sec 316 (Criminal breach of trust)","IT Act Sec 66D (Cheating by personation using a computer resource)","Consumer Protection Act, 2019 Sec 2(47) (Unfair trade practice)"]}},{id:"IN-033",vector:"Employment & Mule Fraud",severity:"critical",title:"Fake overseas IT jobs that traffic Indians into cyber-scam compounds",summary:"Social media ads offer well-paid data-entry or IT jobs in Thailand, Dubai or elsewhere on a tourist visa. Recruits are moved across a border into guarded compounds in Myanmar, Cambodia or Laos, their passports are taken, and they are forced to run investment, digital-arrest and romance scams on Indians.",red_flags:["High salary job abroad offered through an Instagram, Telegram or WhatsApp ad, with free flight and food","Instruction to travel on a tourist or visit visa, with the work permit 'handled later'","Agent receives you on arrival and moves you by road or boat to a different country","Passport and phone taken, contracts signed under pressure, and demands to scam others or face punishment"],control_points:["Check the recruiting agent and the employer on the Ministry of External Affairs' eMigrate portal and with the Protector of Emigrants before travelling","Do not travel on a visit visa to work; insist on a written contract and a visa that allows work","Share your itinerary and the agent's details with family; if trapped, contact the Indian embassy and local police at once","Families can report missing relatives and recruiters on 1930 and to state police anti-human-trafficking units"],rails:["Cash","UPI VPAs","P2P Cryptocurrency (USDT)"],targets:["Young IT and data-entry job seekers","Graduates in small towns","Unemployed youth"],media:{type:"audio",title:"Reconstructed Call \xB7 Overseas Recruiter and the Aftermath",duration:58,transcript:[{time:0,speaker:"Scammer (Fake Overseas Recruiter)",text:"Data entry and IT support job in Bangkok, salary \u20B980,000, with free flight and food. You only need a tourist visa, our company will handle the work permit."},{time:15,speaker:"Victim",text:"Is it safe to work on a tourist visa?"},{time:22,speaker:"Scammer (Fake Overseas Recruiter)",text:"Everyone does it. An agent will receive you at the airport and take you to the office."},{time:33,speaker:"Victim",text:"They took my passport and drove us across a river at night. Now they say I must make scam calls to Indians or I will be punished."},{time:47,speaker:"Genuine Embassy Officer",text:"Contact the Indian Embassy and local police as soon as you can. Many Indians have been rescued from such centres. Do not sign contracts under pressure."}],iocs:{recruitment_artifacts:["Social media ads for 'IT data entry' jobs in Thailand or Dubai","Agents in Bangkok, Dubai and Indian cities"],travel_indicators:["Tourist or visit visa for work","Passport collected on arrival and road or boat transfer across a border"],compound_indicators:["Armed guards, locked compounds and one-year contracts","Scripts for investment, digital-arrest and romance scams"],payment_pattern:["Agent fees in cash or UPI","Proceeds of scams moved as USDT"]},legal_statutes:["BNS Sec 143 (Trafficking of persons)","BNS Sec 318(4) (Cheating)","BNS Sec 61 \xB7 111 (Criminal conspiracy; organised crime)","Emigration Act, 1983 Sec 10 \xB7 24 (Registration of recruiting agents; offences)","IT Act Sec 66D (Cheating by personation using a computer resource)"]}},{id:"IN-034",vector:"Employment & Mule Fraud",severity:"medium",title:"Registration-fee and security-deposit job scams with fake offer letters",summary:"Fake HR executives call job-portal users, charge a registration fee for an 'online test', send an offer letter on a real company's letterhead, and then ask for training charges or a laptop security deposit before disappearing. Some run a call centre or an office that vanishes overnight.",red_flags:["A recruiter who asks for a fee for registration, tests, training, ID cards or a laptop security","Offer letter sent from a free mail ID or a lookalike domain, with no interview or only a short chat","Payment to a personal account or UPI ID, and an urgency to pay 'today' to hold the post","The real company says it never made the offer and does not charge for jobs"],control_points:["Do not pay anyone for a job. Genuine employers do not charge candidates for tests, training or laptops","Verify the offer with the company's HR on its official website, and check the email domain on the letter","Report the number and account on 1930 and cybercrime.gov.in, and report the fake offer to the company","Job portals should flag recruiters that ask for money and share suspect numbers with police"],rails:["UPI VPAs","Direct IMPS Transfers","Mule Accounts"],targets:["Freshers and graduates","Job seekers on job portals","Women seeking work from home"],media:{type:"audio",title:"Reconstructed Call \xB7 Fake HR Executive and Security Deposit",duration:55,transcript:[{time:0,speaker:"Scammer (Fake HR Executive)",text:"You have been shortlisted for a work-from-home HR role at a top company. Pay a \u20B91,650 registration fee for the online test."},{time:14,speaker:"Victim",text:"I paid and passed the test. I received an offer letter by email."},{time:22,speaker:"Scammer (Fake HR Executive)",text:"Congratulations. Now pay \u20B95,000 training charges and \u20B920,000 refundable security for your laptop."},{time:34,speaker:"Victim",text:"The company's HR says they never sent this letter."},{time:42,speaker:"Genuine Company HR Representative",text:"We never charge for jobs. Our offers come only from our official domain. Please report this to the cyber police."}],iocs:{email_artifacts:["Offer letter from a free mail ID or a lookalike company domain","Company logo and letterhead copied from a real firm"],fee_pattern:["Registration fee, then training charges, then laptop security","Amounts between \u20B9500 and \u20B925,000 per candidate"],premises:["Rented office or call centre that closes overnight"],payment_handles:["hr.registration.fee@ybl (illustrative)","Accounts in several banks used to collect fees"]},legal_statutes:["BNS Sec 318(4) (Cheating)","BNS Sec 319(2) (Cheating by personation)","BNS Sec 336 (Forgery; fake offer letters)","BNS Sec 61 (Criminal conspiracy)","IT Act Sec 66D (Cheating by personation using a computer resource)"]}},{id:"IN-035",vector:"Employment & Mule Fraud",severity:"high",title:"Fake study-abroad and visa agents: forged admission letters and fee receipts",summary:"An immigration consultant sells a package for admission, funds proof and visa, and supplies forged college offer letters and fee receipts. Students travel, study and work for years and only discover the fraud when they apply for permanent residence and face removal.",red_flags:["Guaranteed visa or admission in a package priced far above the college's official fees","Consultant handles all documents and sends offer letters and fee receipts directly, discouraging you from checking with the college","Fake or unusual 'GIC' or funds-proof slips, or advice not to contact the bank","The college has no record of your admission when you arrive, or the consultant is unlicensed with a past forgery case"],control_points:["Verify every offer letter and fee receipt directly with the college's admissions office and on the official visa and institution portals","Use only licensed consultants and check them with the relevant state and central authorities","Pay tuition directly to the institution through traceable channels, never in cash to the consultant","Affected students and families can file with the police EOW and seek help from the state NRI affairs department"],rails:["RTGS / NEFT","Cash","Direct IMPS Transfers"],targets:["Students aspiring to study abroad","Families funding overseas education","Skilled-worker migrants"],media:{type:"audio",title:"Reconstructed Call \xB7 Consultant, Forged Offer Letter and Later Removal Notice",duration:56,transcript:[{time:0,speaker:"Scammer (Fake Immigration Consultant)",text:"Guaranteed Canadian study permit. Pay \u20B916 lakh for the admission, funds proof and visa in one package."},{time:13,speaker:"Victim",text:"Can I see the college's own admission portal?"},{time:20,speaker:"Scammer (Fake Immigration Consultant)",text:"Do not worry. I will send the offer letter and fee receipt directly. You do not need to check anything."},{time:33,speaker:"Victim",text:"Years later, my permanent residence check says the admission letter is fake, and I have a removal notice."},{time:46,speaker:"Genuine Student Support Counsellor",text:"Verify every letter on the college and immigration websites, use only licensed consultants, and contact your state NRI affairs department for legal help."}],iocs:{document_artifacts:["Forged acceptance letters and fee receipts from named colleges","Fake funds-proof (GIC) slips"],agent_patterns:["Consultant with a prior forgery arrest who restarted under a new firm","Package priced at about \u20B916 lakh per student"],payment_pattern:["Large payments to the consultant, with commission deducted from refunds","Cash and bank transfers to firm accounts"],outcome_indicators:["College has no admission record","Removal order after a residence application"]},legal_statutes:["BNS Sec 318(4) (Cheating)","BNS Sec 336 \xB7 340 (Forgery; using forged documents as genuine)","BNS Sec 61 (Criminal conspiracy)","Emigration Act, 1983 Sec 10 \xB7 24 (Registration of recruiting agents; offences)","IT Act Sec 66D (Cheating by personation using a computer resource)"]}},{id:"IN-036",vector:"Employment & Mule Fraud",severity:"high",title:"Fake government job rackets: forged appointment letters for lakhs",summary:"Touts pose as officials of a commission or ministry, promise jobs in the railways, post office or other departments without an exam, and collect lakhs for 'application forms' and 'placements'. They issue forged appointment letters, fake medicals and even sham training.",red_flags:["A job in a central or state department offered for a cash payment, with no exam or a 'direct quota'","Meetings in hotels, 'training' at stations or offices, and fake medical tests at government hospitals","Appointment letter with a seal but no official communication or joining instructions from the department","Original certificates collected, and the tout becomes unreachable when you ask for a refund"],control_points:["Government jobs are never sold; apply only through the department's official notification and portal","Verify any appointment letter directly with the department or the recruitment board before paying or resigning","Do not hand over original certificates; report the tout to the police Economic Offences Wing and on 1930","Families should avoid paying through cash or personal accounts and should keep records of every meeting and payment"],rails:["Cash","RTGS / NEFT","Mule Accounts","UPI VPAs"],targets:["Government job aspirants","Families of unemployed graduates","Rural and small-town youth"],media:{type:"audio",title:"Reconstructed Meeting \xB7 'Deputy Secretary' and a Direct-quota Job",duration:52,transcript:[{time:0,speaker:"Scammer (Fake Ministry Official)",text:"I am a Deputy Secretary at the commission. Jobs in the postal department are available directly for \u20B918 lakh each. No exam is needed."},{time:15,speaker:"Victim",text:"How do I know the appointment is real?"},{time:22,speaker:"Scammer (Fake Ministry Official)",text:"We will meet at a five-star hotel. You will get an appointment letter with the department seal and a medical test at a government hospital."},{time:36,speaker:"Victim",text:"I paid \u20B93 lakh for the application form, and the department says my appointment letter is fake."},{time:46,speaker:"Genuine Cyber Cell Officer",text:"Government jobs are never sold. Check recruitment only on the official notification, and report such offers to the Economic Offences Wing and on 1930."}],iocs:{document_artifacts:["Forged appointment orders with government seals and signatures","Fake joining letters and fake medical memos"],website_artifacts:["Fake recruitment board site that shows 'results'","Fake vacancies posted on cloned portals"],meeting_patterns:["Hotels near railway stations or in city centres","Sham training at a station or office"],payment_pattern:["Cash and RTGS payments of \u20B92 lakh to \u20B918 lakh per candidate"]},legal_statutes:["BNS Sec 318(4) (Cheating)","BNS Sec 319(2) (Cheating by personation)","BNS Sec 336 \xB7 340 (Forgery; using forged documents as genuine)","BNS Sec 61 \xB7 111 (Criminal conspiracy; organised crime)","IT Act Sec 66D (Cheating by personation using a computer resource)"]}},{id:"IN-037",vector:"Phishing & Account Takeover",severity:"critical",title:"Business email compromise: spoofed supplier email with 'new bank details'",summary:"Fraudsters spoof or break into a supplier's email, send a genuine-looking invoice with changed bank details, and a company's accounts team pays crores to the fraudster's account, often abroad. Some cases involve corporate net-banking takeover through leaked staff data.",red_flags:["An email from a regular supplier or vendor that suddenly gives a new bank account for an old invoice","Sender address that differs by one character, or a reply-to that points elsewhere","Pressure to pay quickly, claims that the usual phone line is down, or a request to reply only by email","Corporate net-banking changes of registered mobile or email followed by many transfers in a short period"],control_points:["Confirm any bank-detail change by calling the supplier on a number you already hold, not the one in the email","Use dual approval for new payees and hold first-time large payments for verification","If you have paid, call 1930 and file at cybercrime.gov.in within hours; recall and freeze requests work best when quick","Banks should alert corporate customers to changes in registered mobile numbers or email and block rapid high-value transfers"],rails:["RTGS / NEFT","Mule Current Accounts","SWIFT Transfers"],targets:["Importers and exporters","Traders and distributors","Companies with outside suppliers","Finance and accounts teams"],media:{type:"audio",title:"Reconstructed Email Walk-through \xB7 Spoofed Supplier Invoice",duration:55,transcript:[{time:0,speaker:"Scammer (Spoofed Supplier Email, Read Aloud)",text:"Dear accounts team, our bank has changed. Please pay the pending invoice of two lakh thirty eight thousand dollars to the new account in the attached proforma by tomorrow."},{time:15,speaker:"Victim (Accounts Manager)",text:"The invoice number matches our order, but the bank is different from last time. Let me check with the supplier by email."},{time:27,speaker:"Scammer (Spoofed Supplier Email, Read Aloud)",text:"Our regular phone line is down, so please reply here only. The shipment will be held at customs if payment is delayed."},{time:40,speaker:"Victim (Accounts Manager)",text:"We transferred the amount by NEFT. Now the real supplier says they never received any payment."},{time:50,speaker:"Genuine Bank Cyber Cell Officer",text:"File on the cyber crime portal and call 1930 right now. We can request a freeze or a recall if you act within hours."}],iocs:{email_artifacts:["Lookalike supplier address with one character changed","Proforma invoice with new beneficiary bank details"],payment_pattern:["NEFT or SWIFT transfer to a new foreign or mule current account","Pressure to pay within a day"],account_takeover:["Registered mobile or email changed on a corporate net-banking profile","Dozens of transfers within weeks"],mule_accounts:["Acct: 8802XXXX5163 \xB7 IFSC FAKE0006418"]},legal_statutes:["BNS Sec 318(4) (Cheating)","BNS Sec 319(2) (Cheating by personation)","BNS Sec 61 (Criminal conspiracy)","IT Act Sec 43 \xB7 66 (Unauthorised access; computer related offences)","IT Act Sec 66C \xB7 66D (Identity theft; cheating by personation)"]}},{id:"IN-038",vector:"Phishing & Account Takeover",severity:"high",title:"AePS fraud: cloned fingerprints used for Aadhaar-enabled withdrawals",summary:"Gangs copy thumb impressions from property registration and other documents onto silicone sheets, then use the clones with an Aadhaar number on micro-ATMs or AePS apps to withdraw cash from linked accounts. No card, PIN or OTP is needed.",red_flags:["SMS alerts for Aadhaar-enabled withdrawals when you used no card, PIN or OTP","Many small withdrawals of up to \u20B910,000 from different accounts in the same area","Your thumb impression and Aadhaar number were on a registration paper or a public portal","Local operators who ask you to press your thumb on registers or scanners without a clear reason"],control_points:["Lock your Aadhaar biometrics through the UIDAI website or mAadhaar app and unlock only when needed","Ask your bank to switch off AePS if you do not use it, and watch SMS alerts for 'AEPS' transactions","Report on 1930 and in writing to the bank within three working days; your liability is limited when you report quickly","Registry offices and portals should mask biometrics and Aadhaar numbers in published documents"],rails:["AePS Micro-ATM Withdrawals","Mule Accounts","Cash"],targets:["Rural account holders","Property buyers and sellers","Senior citizens","Labourers and welfare beneficiaries"],media:{type:"audio",title:"Reconstructed Complaint Call \xB7 Withdrawal Without a Card or OTP",duration:55,transcript:[{time:0,speaker:"Victim (Villager)",text:"I got messages that \u20B99,500 was withdrawn from my account through the Aadhaar system, but I did not use any card or OTP."},{time:14,speaker:"Genuine Bank Customer Care",text:"Sir, the transaction was done with your Aadhaar number and a fingerprint match. No OTP is needed for this channel."},{time:27,speaker:"Victim (Villager)",text:"How can anyone have my fingerprint? I only pressed my thumb on the registration papers when I bought the plot."},{time:40,speaker:"Genuine Cyber Police Officer",text:"Gangs copy thumb impressions from registration documents onto silicone and use them on micro-ATMs. Lock your biometrics and report on 1930."},{time:52,speaker:"Genuine Bank Customer Care",text:"Please give us a written complaint within three working days so that the bank can investigate."}],iocs:{biometric_artifacts:["Thumb impressions copied on butter paper and transferred to silicone sheets","Source: registration papers or public portals with Aadhaar and fingerprints"],transaction_pattern:["Withdrawals of up to \u20B910,000 through AePS apps and micro-ATM devices","Hundreds of transactions across many accounts"],operators:["Unregistered or colluding CSC and micro-ATM operators","Accounts opened on forged documents"],alerts:["SMS stating AEPS cash withdrawal without any card or OTP"]},legal_statutes:["BNS Sec 318(4) (Cheating)","BNS Sec 336 (Forgery; cloned biometric used as genuine)","BNS Sec 111 (Organised crime)","IT Act Sec 43 \xB7 66 (Unauthorised access; computer related offences)","IT Act Sec 66C (Identity theft)","Aadhaar Act, 2016 (Protection of identity and biometric information, with penalties for misuse)","RBI customer-liability circular, 6 July 2017 (Report unauthorised transactions within three working days)"]}},{id:"IN-039",vector:"Phishing & Account Takeover",severity:"medium",title:"FASTag 'KYC expired' phishing and fake recharge helplines",summary:"A message says your FASTag will be blocked unless you update KYC, or a search result shows a fake FASTag helpline. The 'executive' asks you to install a screen-sharing app or enter card details on a lookalike page and then drains the bank account.",red_flags:["SMS or WhatsApp message saying your FASTag KYC has expired, with a link or a number to call","Lookalike FASTag or recharge sites that ask for card number, UPI PIN or OTP","Support 'executive' who asks you to install AnyDesk or QuickSupport","Helpline number found through a search result instead of the issuer's app or card"],control_points:["Update FASTag KYC only through your issuer bank's official app or the IHMCL portal and use the 1033 national helpline","Never install a screen-sharing app for a recharge or KYC; no genuine FASTag service asks for one","If you shared codes or installed an app, switch on airplane mode, call your bank and 1930, and uninstall the app","Buy FASTags only from banks or the IHMCL; fake tags sold online are not valid at icle.com/southern-states/telangana/hyderabad-cyber-scam-targeting-small-businesses-1812451"},{title:"Chennai: youth arrested in a QR code sticker scam across 7 shops",source:"ETV Bharat, Aug 2022",url:"https://etvbharat.com/english/bharat/tn-man-arrested-in-qr-code-scam-in-chennai/na20220811163937530530290"},{title:"Man arrested for replacing the QR code at an Aizawl petrol pump",source:"Deccan Herald / PTI",url:"https://www.deccanherald.com/amp/story/india%2Fmizoram%2Fman-arrested-for-stealing-money-by-changing-qr-code-of-petrol-pump-3270316"},{title:"\u20B949.68 lakh QR code fraud at a Calangute medical store",source:"Herald Goa, 2026",url:"https://www.heraldgoa.in/?p=468410"}],"IN-018":[{title:"Pulwama police arrest man for forged QR payment confirmations",source:"Kashmir Life",url:"https://kashmirlife.net/police-arrest-man-for-qr-code-payment-fraud-424671/"},{title:"How to avoid small-business payment scams in India",source:"The Munim",url:"https://themunim.com/blog/how-to-avoid-small-business-payment-scams/"},{title:"UPI fraud tactics: ten scams that target Indian payments",source:"Quick Heal",url:"https://www.quickheal.co.in/knowledge-centre/upi-fraud-tactics-explained-10-scams-that-target-indian-payments/"}],"IN-019":[{title:"The UPI overpayment scam and how to protect yourself",source:"CyberCure (India)",url:"https://cybercure.in/consulting/?p=8969"},{title:"Recharge refund of \u20B9399 costs a 25-year-old \u20B940,000 (Mumbai)",source:"The Free Press Journal",url:"https://www.freepressjournal.in/mumbai/recharge-refund-of-399-costs-25-year-old-40k"},{title:"UPI fraud: types of scams and how to avoid them",source:"Quick Heal",url:"https://www.quickheal.co.in/knowledge-centre/avoid-upi-fraud-payment-scams-guide"}]});Object.assign(Qe,{"IN-020":["ED searches in Muzaffarpur in December 2025 followed a SIM-swap case in which about \u20B91.29 crore was drawn from two savings accounts at a Punjab National Bank branch, and the money was withdrawn in cash from ATMs in Kolkata.","The Karnataka High Court held BSNL liable for a 2019 SIM swap that drained about \u20B988 lakh from a co-operative bank, saying duplicate SIMs were issued without proper verification.","Earlier Indian cases involved a Mumbai textile merchant who lost \u20B91.86 crore overnight after a SIM swap, and Bengaluru CID arrests that included a bank deputy manager and dozens of duplicate SIMs."],"IN-021":["Nagaland Police warned in May 2025 about a 'PM Kisan Yojana v12.apk' that takes over WhatsApp and forwards itself to all contacts and groups.","A Hyderabad man lost \u20B91.95 lakh in August 2025 after installing a fake 'PM Kisan' app from a WhatsApp message, and Telangana's cyber bureau listed PM-Kisan and PM-Yojana APKs among the 2024 methods.","Bhopal police warned in November 2025 about APKs promising PM Awas or PM Kisan instalments, which also appear as e-challan files."],"IN-022":["Kerala Police issued a public advisory on a surge in WhatsApp hacking cases, in which attackers use fake APK links or OTP tricks, lock the owner out for up to 24 hours and ask contacts for money.","Fake government-scheme APKs, such as the PM Kisan file reported in Nagaland, have also been shown to take over WhatsApp and spread themselves."]});Object.assign(ca,{"IN-020":[{title:"ED searches in a \u20B91.29 crore SIM-swap fraud on PNB accounts (Muzaffarpur)",source:"Directorate of Enforcement press release, 16 Dec 2025",url:"https://enforcementdirectorate.gov.in/sites/default/files/latestnews/Press%20Release%20-%20PNB%20SMS%20Fraud%20Scam%20-%20Searches%20-%2016.12.2025%203.pdf"},{title:"Karnataka High Court holds BSNL liable in a \u20B988 lakh SIM swap fraud",source:"Outlook Money",url:"https://www.outlookmoney.com/news/banks-must-take-steps-to-prevent-sim-swap-fraud-says-karnataka-high-court"},{title:"Axis Bank deputy manager among seven held for duplicate-SIM wallet fraud (Bengaluru)",source:"Deccan Herald",url:"https://www.deccanherald.com/india/karnataka/bengaluru/axis-bank-dy-manager-aides-2043714"}],"IN-021":[{title:"Nagaland Police issues alert on malicious 'PM Kisan Yojana' APK",source:"All India Radio News, 2 May 2025",url:"https://www.newsonair.gov.in/nagaland-police-issues-alert-on-malicious-pm-kisan-yojana-apk-file-circulating-across-state"},{title:"Hyderabad man duped of \u20B91.95 lakh via fake PM Kisan APK",source:"Telangana Today, Aug 2025",url:"https://telanganatoday.com/hyderabad-man-duped-of-rs-1-95-lakh-via-fake-pm-kisan-apk"},{title:"Fake APK file scam: Bhopal police warn of PM Awas and PM Kisan lures",source:"The Hitavada, 8 Nov 2025",url:"https://www.thehitavada.com/Encyc/2025/11/8/fake-apk-file-scam-beware-of-cyber-fraudsters-one-click-can-empty-your-bank-ac.html"}],"IN-022":[{title:"WhatsApp hacking scams on the rise: Kerala Police issues alert",source:"UNI",url:"https://www.uniindia.com/whatsapp-hacking-scams-on-the-rise-kerala-police-issues-alert/south/news/3575672.html"},{title:"Fake 'PM Kisan Yojana' APK takes over WhatsApp accounts",source:"Morung Express",url:"https://mail.morungexpress.com/hacking-alert-fake-pm-kisan-yojana-app-jacks-whatsapp-accounts"},{title:"Fake APK file scam: one click can empty your bank account",source:"The Hitavada",url:"https://www.thehitavada.com/Encyc/2025/11/8/fake-apk-file-scam-beware-of-cyber-fraudsters-one-click-can-empty-your-bank-ac.html"}]});Object.assign(Qe,{"IN-023":["Delhi Police's North District cyber station arrested a 30-year-old in June 2026 for allegedly posing as a recruiter, turning victims' screenshots into AI-morphed obscene images and extorting money, with demands repeating months later.","In May 2026 a cyber-cafe operator and his brother in Bhadohi (Uttar Pradesh) were booked for blackmailing a woman with obscene images made from her social media photos using AI.","In February 2026 Coimbatore police arrested a student for making semi-nude AI morphs of 24 female students, and in September 2026 a Kochi student was arrested over AI-morphed images of teachers."],"IN-024":["The AIIMS Delhi ransomware attack of 23 November 2022 took servers down for days and forced hospital services onto manual mode; a case of extortion and cyber terrorism was registered, and CERT-In, Delhi Police and the Home Ministry investigated.","Media reported a demand of about \u20B9200 crore in cryptocurrency, but Delhi Police said no ransom demand had been brought to their notice by AIIMS.","CERT-In's April 2022 directions require covered entities to report specified cyber incidents within six hours."],"IN-025":["Indore police said a family lost \u20B91 lakh after a deepfake video call showed their minor son apparently being threatened during a staged kidnapping.","A Bathinda family lost \u20B93.5 lakh to a video call from a man in a police uniform who claimed their son in Canada had caused an accident; the fraudsters used the night-time gap in Canada.","Bengaluru, Delhi and Mangaluru police have all reported parents receiving calls that their child was arrested or kidnapped, and Goa's cyber cell issued an advisory on 'virtual kidnapping' calls."]});Object.assign(ca,{"IN-023":[{title:"Delhi Police arrest man for AI-morphed image blackmail of young women",source:"The Free Press Journal / IANS, June 2026",url:"https://www.freepressjournal.in/tech/delhi-cyber-police-arrest-man-for-ai-based-blackmail-of-young-women-on-social-media-posed-as-recruiter-trapped-victims-extorted-40000"},{title:"Cyber extortionist arrested for blackmailing women using AI-morphed images",source:"IANS, 8 Jun 2026",url:"https://ianslive.in/cyber-extortionist-arrested-for-blackmailing-women-using-ai-morphed-images--20260608150453"},{title:"Kochi student arrested over AI-made obscene images of teachers",source:"Onmanorama, 4 Sep 2026",url:"https://www.onmanorama.com/kerala/top-news/2026/09/04/kochi-student-arrested-morphed-images.html"},{title:"Bengaluru student who blackmailed women using morphed photos held",source:"The News Minute",url:"https://www.thenewsminute.com/article/benga s-receive-fake-calls-demanding-ransom-for-their-kids-3063474"}]});Object.assign(Qe,{"IN-026":["Mumbai's Economic Offences Wing took over the Torres jewellery case in January 2025 after investors found showrooms shut on 6 January; the Bombay High Court later ordered all FIRs transferred to the EOW and a special investigation team, citing alleged losses of over 1.25 lakh investors.","Investigators described a mix of Ponzi and MLM schemes with weekly returns and referral bonuses; the ED registered a money-laundering case, and these are allegations at the investigation stage.","Earlier Indian cases of the same pattern include Saradha, PACL and SpeakAsia, which led to state depositor-protection laws and the 2019 national ban on unregulated deposit schemes."],"IN-027":["Telangana police reported 213 IPO-fraud cases worth \u20B927.40 crore in January and February 2024, against 627 cases worth about \u20B93.91 crore in all of 2023; groups were named after famous brokerages.","A Goa woman lost about \u20B94.23 crore to a fake IPO and share-market app that told her to invest more because her 'account rating' was low.","An 82-year-old retired hotelier in Mumbai lost \u20B949.24 lakh to a WhatsApp group that posed as a leading securities firm; Gujarat police's awareness material lists fake IPO and pre-IPO allotment as a main investment-fraud type."],"IN-028":["The ED's Hyderabad zone attached \u20B98.46 crore across 92 bank accounts in November 2025 in a fake investment-app and e-commerce fraud case where victims were told to deposit through UPI and withdrawals kept failing; proceeds were converted to USDT.","Haryana Police arrested two men on 30 September 2026 for supplying a bank account to a network that took over \u20B94.72 crore from a Gurugram resident through a bogus Bitcoin and USDT platform.","Delhi and Faridabad police have reported arrests where stolen funds were converted to USDT and sent to overseas handlers."]});Object.assign(ca,{"IN-026":[{title:"Torres Ponzi sca estment-app cyber fraud case",source:"Directorate of Enforcement press release, 20 Nov 2025",url:"https://enforcementdirectorate.gov.in/sites/default/files/latestnews/Press%20Release-PAO-%20Cyber%20Fraud%20Case-20.11.2025.pdf"},{title:"Haryana Police crack a \u20B94.72 crore crypto fraud trail",source:"UNI, 1 Oct 2026",url:"https://www.uniindia.com/north-india/crime-haryana-crypto-fraud/199357"},{title:"Two held from Surat in a \u20B91.12 crore fake-app investment fraud; funds sent as USDT",source:"Deccan Herald / PTI",url:"https://www.deccanherald.com/amp/story/india%2Fgujarat%2Ftwo-held-from-gujarats-surat-in-rs-112-crore-cyber-fraud-case-3534873"},{title:"Delhi Police bust an online investment fraud racket with USDT links",source:"The Week / PTI, 30 Sep 2025",url:"https://www.theweek.in/wire-updates/national/2025/09/30/des46-dl-fraud-racket-bust.html"}]});Object.assign(Qe,{"IN-029":["Punjab's state cyber crime unit arrested a man in June 2025 who allegedly cheated at least 23 people across five states of about \u20B95 lakh through fake OLX rental ads; the arrest followed analysis of data on I4C's Pratibimb portal.","Mumbai cyber police issued an alert on rental scams where 'landlords' refuse a visit, demand an advance to 'block' the flat, and send forged IDs or agreements on WhatsApp; a Kurla businessman reportedly lost \u20B925 lakh in an OLX house-rental case."],"IN-030":["Gujarat Police found a gang of 10 that allegedly built 126 fake accommodation websites with AI-generated and copied images and cheated about 22,000 tourists, including about 7,000 from Gujarat.","Delhi Police arrested a man from Nuh in July 2025 for a fake luxury-hotel booking site; a Delhi man lost \u20B933,000 booking a Goa resort.","Odisha's crime branch blocked 46 fake hotel-booking websites in nine days ahead of the Puri Rath Yatra; Goa police have dismantled gangs selling fake hotel rooms and homestays to tourists."],"IN-031":["PIB Fact Check has repeatedly flagged SMS messages in India Post's name that claim an incomplete address and push a link, including in May 2025 and again in January 2026; India Post says it never asks for address updates or fees through links.","Banks such as RBL have published guides on this smishing pattern, in which a small redelivery fee is followed by card-detail theft."],"IN-032":["A Lucknow businessman reportedly paid about \u20B926 lakh in instalments for 'insurance', 'breeder licence' and 'delivery' for a Siberian Husky puppy that never arrived, and a court ordered an FIR against the Aizawl-based sellers.","Nuh police arrested a man for selling 'best breed' dogs through fake Facebook and Instagram profiles, and Bengaluru and Pune victims have reported losing \u20B99,000 to \u20B928,000 to fake puppy sellers."]});Object.assign(ca,{"IN-029":[{title:"Mohali man arrested in a \u20B95 lakh OLX rental scam across multiple states",source:"The Free Press Journal",url:"https://www.freepressjournal.in/amp/india/punjab-news-mohali-resident-arrested-in-5-lakh-olx-rental-scam-across-multiple-states"},{title:"Mumbai cyber police alert on online rental scams and fake property listings",source:"The Free Press Journal",url:"https://www.freepressjournal.in/amp/mumbai/mumbai-news-cyber-police-issue-alert-on-online-rental-scam-citizens-warned-against-fake-property-listings"},{title:"Kurla businessman duped of \u20B925 lakh in an OLX house rental scam",source:"The Free Press Journal",url:"https://www.freepressjournal.in/amp/mumbai/mumbai-kurla-based-furniture-businessman-duped-of-25-lakh-by-fraudster-in-olx-house-rental-scam-case-registered"}],"IN-030":[{title:"126 fake sites, 22,000 victims: gang that targeted tourists booking stays online",source:"ThePrint",url:"https://theprint.in/india/126-fake-sites-22000-victims-how-a-gang-pulled-off-massive-scam-targeting-tourists-booking-stays-online/3015252/"},{title:"Man held for duping hotel customers through a fake website (Delhi)",source:"The Week / PTI, 10 Jul 2025",url:"https://www.theweek.in/wire-updates/national/2025/07/10/des40-dl-cyber-fraud-arrest.html"},{title:"Puri Rath Yatra: Odisha Crime Branch blocks 46 fake hotel-booking websites in 9 days",source:"Outlook India / PTI",url:"https://www.outlookindia.com/national/puri-rath-yatra-odisha-crime-branch-blocks-46-fake-hotel-booking-websites-in-9-days-2"},{title:"Delhi Police bust fake helicopter booking sites that copied a railway portal",source:"The Tribune",url:"https://www.tribuneindia.com/news/delhi/beware-of-fake-helicopter-booking-sites-delhi-police-bust-online-scam-3-arrested/"},{title:"Goa Police bust fake water-sports, hotel-booking and other scams targeting tourists",source:"Herald Goa",url:"https://www.heraldgoa.in/?p=13714"}],"IN-031":[{title:"Govt debunks SMS from India Post asking people to update their address",source:"All India Radio News, 20 Jan 2026",url:"https://www.newsonair.gov.in/govt-debunks-sms-from-india-post-asking-people-to-update-their-address"},{title:"Fact check: fake India Post delivery scam alert",source:"CyberPeace",url:"https://cyberpeace.org/resources/blogs/factcheck-beware-fake-india-post-delivery-scam-alert"},{title:"How the India Post delivery scam works and how to avoid it",source:"RBL Bank",url:"https://rblbank.com/blog/banking/safe-banking/how-the-india-post-delivery-scam-works-and-how-to-avoid-it"},{title:"India Post 'your package has arrived' viral SMS is stealing your data",source:"The Statesman",url:"https://www.thestatesman.com/india/india-post-your-package-has-arrived-this-viral-sms-is-stealing-your-data-1503438389.html"}],"IN-032":[{title:"UP businessman pays \u20B926 lakh for a Siberian Husky puppy he never got",source:"The Tribune",url:"https://www.tribuneindia.com/news/trending/up-businessman-ends-up-paying-rs-26-lakh-for-siberian-husky-puppy-that-he-never-got-480362"},{title:"Bengaluru man seeking to buy a puppy online cheated of \u20B928,000",source:"Udayavani",url:"https://english.udayavani.com/article/bluru-man-seeking-to-buy-puppy-online-c le accounts","Online shoppers, senior citizens","h"],["Fake TRAI or SIM disconnection call","A caller says your number will be cut for illegal activity and passes you to a fake officer.","Automated call about disconnection in two hours | Pressure to press 9 or speak to an 'officer' | Escalation to police or CBI claims","Telecom regulators do not call to disconnect numbers; check on Sanchar Saathi | Hang up and report on Chakshu","UPI; IMPS / RTGS; Mule accounts","Mobile users, senior citizens","h"],["Fake bank officer and 'safe account'","A caller poses as the bank's fraud team and asks you to move funds to a 'safe account'.","Bank asks you to transfer your own money | Caller knows basic details from leaks | Urgency about an 'ongoing hack'","Banks never ask for a transfer to a safe account | Call the bank on the number printed on your card","UPI; IMPS / RTGS; Mule accounts","Savings account holders","c"],["'Hi Mum' and boss impersonation on WhatsApp","A message from an unknown number uses a relative's or boss's photo and asks for urgent money or gift cards.","New number claiming to be someone you know | Money needed urgently and cannot talk | Payee name differs from the person","Call the person on their saved number | Ask a question only they can answer","UPI; Gift cards; Mule accounts","Parents, employees, small business staff","m"],["AI voice-clone family emergency","A cloned voice of a relative claims an accident or arrest and asks for an instant transfer.","Panicked call from an unknown number | Voice sounds right but will not take questions | Payment demanded within minutes","Agree a family code word | Hang up and call the relative directly","UPI; IMPS / RTGS","Parents and grandparents","h"],["Fake gas, cylinder or subsidy officer","A caller offers a subsidy or threatens a cylinder cut-off and pushes a link or app.","Gas or subsidy message from a personal number | App or link to 'update' details | Small verification payment","Use only the distributor's number from your gas booking record | Do not install apps from chat","UPI; Sideloaded APK","Households, senior citizens","h"],["Fake income-tax or GST officer","Business owners get calls or emails about a tax default, audit or raid and a payment demand.","Notice over phone or WhatsApp | Payment to a personal account | Threat of seizure or arrest","Check notices on the official tax portal | Consult your CA before paying anything","UPI; IMPS / RTGS; Mule accounts","Small businesses, traders, freelancers","h"],["Fake police 'your relative is arrested' call","A caller claims a son, daughter or spouse is held in a case and asks for bail or settlement money.","Relative cannot be reached at that moment | Caller plays a distressed voice or noise | Settlement requested via UPI","Call the relative and a family member before paying | Never pay a 'settlement' to a stranger","UPI; IMPS / RTGS","Parents and elderly relatives","h"],["Fake RBI, SEBI or government scheme officer","The caller 'verifies' accounts, releases a 'blocked refund' or approves a subsidy for a fee.","Regulator or ministry calling about your personal account | Processing or tax fee for a refund | Official-looking letterhead on WhatsApp","Regulators do not collect fees from individuals by phone | Verify on the official website","UPI; IMPS / RTGS","Retail investors, pensioners","h"],["Fake customer care from search results","A listing with a fake support number leads to screen-sharing and drained accounts.","Number found in search or maps | Remote-access app requested | PIN needed to 'receive' a refund","Take numbers only from the official app or card | Never install screen-sharing apps","UPI; Remote access tools","Customers with a refund or delivery issue","h","IN-010"],["Fake insurance, EPFO or pension officer","The caller promises an unclaimed bonus or pension release for a processing fee.","Unexpected 'maturity' or bonus | Fee or tax before release | Request for OTP or card details","Check policy status with the insurer's own app | Never pay to receive a benefit","UPI; IMPS / RTGS","Policyholders, retirees","m"]],"Payment Fraud":[["UPI collect request approval","A 'buyer' sends a collect request and says approving it will credit money to you.","Approve button on a 'receive' request | Small test credit followed by a larger request | Payee name that is not the buyer","Decline unknown collect requests | Remember a PIN is only for sending money","UPI collect request","Online sellers, new UPI users","m","IN-002"],["'Scan this QR to receive money'","A QR sent on WhatsApp opens a payment screen that debits the victim.","QR image with an amount in it | PIN requested after scanning | 'Server error' and a second code","Never scan a QR to receive money | Read payee name and amount on every screen","UPI QR codes","Sellers, shopkeepers","m","IN-002"],["'I'm nearby, scan this QR to receive payment' call to a business","A caller books a service, says he is close by, offers an advance and sends a QR code to 'receive' it.","Urgent service request from an unknown caller | Advance offered before any visit | QR or collect request instead of a transfer","Give your own UPI ID or QR so the customer pays you | Check the bank SMS, not a screenshot, before starting work","UPI QR codes; Wallets; Mule accounts","Salons, tailors, caterers, clinics, repair and cab businesses","h","IN-013"],["Fake payment screenshot or receipt","A buyer shows an edited success screen and collects goods or services.","Screenshot only, no bank SMS | Buyer in a hurry to leave | Payer name does not match","Check the credit in your bank app | Do not release goods on a screenshot","UPI; Edited receipts","Shopkeepers, delivery partners, tutors","m"],["Wrong-transfer refund request","A small amount arrives 'by mistake' and the sender asks you to refund it to another number.","Unexpected credit and an instant call | Refund asked to a different account | Pressure not to contact the bank","Ask the sender to use the bank's recall process | Do not send money back yourself","UPI; Mule accounts","Anyone with a UPI ID","m"],["Merchant QR sticker swap","A fraudster pastes a QR over a shop's QR so that customers pay the wrong account.","Sticker over the original QR | Payee name differs from the shop | Customers say payment did not arrive","Check payee name when paying | Merchants should inspect QRs daily and use a soundbox","UPI QR codes","Small merchants, cafes, kirana stores","m"],["Fake 'payment received' alert","A spoofed SMS or app notice makes staff believe money has arrived.","SMS from a personal number | No balance update in the bank app | Customer leaves quickly","Verify in the official app or soundbox | Train staff never to trust forwarded alerts","UPI; Spoofed notices","Petrol pumps, retail staff","m"],["Cashback or reward needs your PIN","A message promises cashback and tells you to enter your PIN to receive it.","PIN needed to 'claim' cashback | Link from an unknown sender | Fake brand page","Never enter a PIN to receive money | Redeem rewards only inside official apps","UPI; Wallets","Young UPI users","m"],["UPI AutoPay mandate abuse","A \u20B91 'verification' request actually creates a recurring mandate.","Request mentions mandate or recurring | Merchant name unfamiliar | Repeated small debits later","Read the request type before approving | Review and revoke mandates in your UPI app","UPI AutoPay mandate","App users, subscribers","m"],["ATM card swap and shoulder surfing","A helper watches your PIN and swaps your card at the ATM.","Stranger offers help at the ATM | Card returned is different | Alert for a withdrawal you did not make","Cover the keypad and never accept help | Block the card at once if swapped","Card; Cash withdrawal","ATM users, senior citizens","m"],["Fake refund link after a failed payment","A 'refund' page asks for card details or a PIN after a failed transaction.","Link from an unknown number | Asks for CVV, PIN or OTP | Page address that is not the bank's","Failed payments reverse automatically through the bank | Raise a dispute inside the app","Card; UPI","Online shoppers","m"],["Overpayment scam on sellers and businesses","A buyer 'accidentally' overpays and asks for the extra back before the first payment reverses.","Payment larger than the price | Refund requested in a hurry | Original payment later fails","Refund only after the original payment settles | Return money through the same channel","UPI; Cheques","Small businesses, sellers","m"],["Card skimming and cloning","Devices on ATMs or card machines copy card data and PINs.","Loose or bulky card slot | Hidden camera near the keypad | Card-present transactions you did not make","Use ATMs inside bank branches when possible | Set low limits and transaction alerts","Card; Cash withdrawal","ATM and POS users","h"]],"Device Compromise":[["Electricity-bill disconnection APK","A 9:30 PM cut-off message leads to an app that reads OTPs and drains accounts.","Message from a personal number | APK shared on chat | Accessibility and SMS permissions","Check bills with your discom's official number | Never install an APK from chat","Sideloaded APK; UPI","Households, senior citizens","c","IN-003"],["Fake traffic-challan APK","A WhatsApp 'challan' file is a trojan that also spreads to contacts.","Challan sent as an .apk | Real vehicle number quoted | Contacts receive the file from you","Check challans only on the official portal | Disable installs from unknown apps","Sideloaded APK","Vehicle owners","h","IN-007"],["Wedding-invitation APK","A digital 'invitation' from a hijacked contact installs a trojan.","Invite arrives as an .apk | Sender number looks like a friend's | Phone slows after opening","Ask the sender by call | Never open files with the .apk extension","Sideloaded APK","Families, WhatsApp users","h","IN-007"],["Bank rewards and KYC APK","A 'rewards' or 'KYC' app captures card data and OTPs.","Bank app not on the app store | Asks for SMS and accessibility rights | Urgency abou
