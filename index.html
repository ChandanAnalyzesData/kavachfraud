audster)",text:"Army logistics truck will pick it up today. I am sending an official Army Cantonment QR code on WhatsApp. Just scan it on Google Pay and enter your PIN so government accounts can credit \u20B918,000 to you."},{time:27,speaker:"Seller",text:"Wait, Google Pay is saying \u20B918,000 will be debited from my account."},{time:31,speaker:"Buyer (Fraudster)",text:"Do not worry sir, that is just verification protocol. Once you enter your UPI PIN, it will reverse immediately."}],iocs:{fake_vpas:["cisf.canteen.settlement@okaxis","defencerefund98@ybl"],suspicious_mobiles:["+91 98721 xxxxx"]},legal_statutes:["IT Act Sec 66C (Identity theft)","IT Act Sec 66D","BNS Sec 318(4)"]}},{id:"IN-003",vector:"Device Compromise",severity:"critical",title:"Electricity Bill Deactivation & Malicious APK Sideloading",summary:"An SMS warns that your electricity or power connection will be cut off tonight at 9:30 PM due to unpaid bills, prompting you to call an executive who directs you to install a device-monitoring Android application.",red_flags:["SMS arrives from personal 10-digit mobile numbers rather than registered telecom header IDs (e.g., BESCOM/TNEB)","Ultimatum that electricity or gas supply will be suspended at 9:30 PM tonight","Directs caller to install remote support apps (AnyDesk, QuickSupport) or download a direct .apk file over WhatsApp","Demands a token \u20B910 verification charge, capturing entered debit card details and intercepting bank OTPs"],control_points:["Never install Android package files (.apk) received via SMS, WhatsApp, or untrusted websites","Pay electricity and utility bills exclusively through official Bharat Bill Payment System (BBPS) apps or utility portals","If installed, immediately put device in Airplane mode, revoke Accessibility permissions, and factory reset"],rails:["Sideloaded APKs","Remote Access Tools","AutoPay Mandates"],targets:["Domestic electricity consumers","Elderly household managers"],media:{type:"audio",title:"Reconstructed Inbound Call \xB7 Electricity Disconnection APK Trap",duration:40,transcript:[{time:0,speaker:"Fake Officer",text:"State Power Support desk. Sir, your bill of \u20B91,420 from last month is un-updated on server. Disconnection order is scheduled for 9:30 PM."},{time:12,speaker:"Customer",text:"I already paid through netbanking two weeks ago. Here is my receipt."},{time:18,speaker:"Fake Officer",text:"Bank server failed to update power substation ledger. I am sending an official Suvidha Power App link on WhatsApp. Install it and pay \u20B910 recharge so update clears."},{time:30,speaker:"Fake Officer",text:"Allow all permissions for SMS and Screen Sharing so our technical engineer can generate the waiver receipt."}],iocs:{malicious_packages:["com.bijli.suvidha.update","com.powerbill.support.apk"],telecom_origin:["+91 74889 xxxxx"]},legal_statutes:["IT Act Sec 43 (Damage to computer systems)","IT Act Sec 66 (Hacking)","IT Act Sec 66D"]}},{id:"IN-004",vector:"Extortion",severity:"high",title:"Unregistered Instant Loan Apps & Contact Defamation",summary:"Dubious mobile lending apps offer collateral-free micro-loans (\u20B93,000\u2013\u20B910,000), exfiltrate contact books and private galleries during installation, and use recovery agents who circulate morphed photos to family members for extortion.",red_flags:["Mobile apps demanding invasive permissions for full Contacts, Camera, and Photo Gallery access during onboarding","Deduction of 40\u201350% upfront as 'processing fees,' with full balance repayment demanded in 6 to 7 days","Recovery agents using abusive WhatsApp voice notes and sending morphed, obscene pictures of the borrower","Lending entities not backed by an RBI-registered Non-Banking Financial Company (NBFC)"],control_points:["Always check the official RBI list of registered NBFCs before downloading any digital loan app","Immediately revoke photo gallery and contact book permissions for utility and finance apps in Android settings","Refuse further extortion payments; lodge a complaint at cybercrime.gov.in and notify your primary contacts"],rails:["UPI VPAs","Unregistered Gateways","Direct IMPS Transfers"],targets:["College students","Gig workers","Salaried employees in urgent cash deficits"],media:{type:"audio",title:"Reconstructed Extortion Voicemail \xB7 Illegal Loan Recovery Agent",duration:30,transcript:[{time:0,speaker:"Recovery Agent",text:"Listen to me carefully. You took \u20B94,000 from SpeedyRupee loan app. Today is day 7. Pay \u20B98,500 by 2 PM or face consequences."},{time:11,speaker:"Borrower",text:"I was disbursed only \u20B92,200. How can you demand \u20B98,500 in one week?"},{time:18,speaker:"Recovery Agent",text:"We have downloaded all 420 contacts from your phone and your private photos. If payment is not completed in 30 minutes, we are sending morphed indecent photos to your parents, boss, and WhatsApp groups."}],iocs:{flagged_apps:["SpeedyRupee","CashPocket","LoanGuru APK"],blackmail_numbers:["+91 91234 xxxxx","+91 88200 xxxxx"]},legal_statutes:["IT Act Sec 67 (Publishing obscene material)","BNS Sec 308 (Extortion)","BNS Sec 351 (Criminal intimidation)"]}},{id:"IN-005",vector:"Investment Fraud",severity:"critical",title:"Telegram Part-Time Task & FPI Stock Trading Syndicate",summary:"Victims are recruited via WhatsApp to like YouTube videos or write hotel reviews for \u20B9150 per task, then inducted into exclusive Telegram groups run by fake SEBI-registered brokers who freeze funds in unhosted trading portals.",red_flags:["Unsolicited job offers on WhatsApp/Telegram offering \u20B92,000\u2013\u20B95,000 per day for simple rating/liking tasks","Initial small earnings (\u20B9150\u2013\u20B9500) disbursed reliably to build artificial trust","Requirement to execute 'prepaid trading tasks' or invest in foreign portfolio investor (FPI) block trades","Demands for additional payments described as 'TDS', 'currency conversion fees', or 'SEBI clearance penalty' to withdraw accumulated balances"],control_points:["Verify investment firms and stockbrokers exclusively on the SEBI Intermediary Registry (sebi.gov.in)","Never execute wire transfers to personal savings or current accounts claiming to belong to corporate brokerage houses","Acknowledge the classic task trap: legitimate corporations never require candidates to deposit capital to release earned compensation"],rails:["Corporate Current Mules","RTGS / NEFT","P2P Cryptocurrency (USDT)"],targets:["Homemakers","Work-from-home job seekers","Retail equity traders"],media:{type:"audio",title:"Reconstructed Group Audio Call \xB7 Fraudulent Institutional Trading Broker",duration:38,transcript:[{time:0,speaker:"Syndicate Admin",text:"Congratulations members. Today our institutional VIP account achieved 480% gain on pre-IPO allocation. Next window opens at 3:00 PM."},{time:11,speaker:"Victim",text:"Sir, my trading dashboard shows \u20B918 lakh balance, but when I click withdraw, the app says account frozen."},{time:20,speaker:"Syndicate Admin",text:"Because this is institutional quota, SEBI regulations require you to deposit 30% capital gains tax of \u20B95.4 lakh into our nodal account first. Once paid, total amount unlocks immediately."}],iocs:{fake_portals:["trade-institutional-app.xyz","sebi-vip-portal.top"],mule_current_accounts:["Acct: 92202004812xxxx (Axis Bank)","IFSC: UTIB0001429"]},legal_statutes:["IT Act Sec 66D","SEBI Act Sec 12A (Prohibition of manipulative and deceptive devices)","BNS Sec 318(4)"]}},{id:"IN-006",vector:"E-commerce Fraud",severity:"medium",title:"Cloned Brand Store: Fake boAt-style Website with Rock-bottom Prices",summary:"Sponsored ads on search and social media push a lookalike store of a popular Indian audio brand, selling earbuds and smartwatches at impossible prices. Buyers are sent to a prepaid payment page and then receive nothing, a cheap substitute, or a useless item.",red_flags:["Ad shows branded earbuds or watches at a fraction of market price (for example a \u20B9285 price) with a countdown timer","Domain is a lookalike of the brand name, recently registered, and hosted on a generic storefront platform","Prepaid payment only, no cash on delivery, and no invoice, order tracking or 'My orders' section after payment","Support runs only on a free email address or a mobile number, and the merchant name on the payment page does not match the brand"],control_points:["Buy only from the brand's official website (boat-lifestyle.com for boAt) or from a verified brand store on a major marketplace; never from an ad link","Check the exact domain spelling, the domain age and the seller details before paying; if a price looks too good, assume it is a trap","Pay with a card or method that allows disputes, and raise a chargeback or UPI complaint with your bank quickly; call 1930 and file at cybercrime.gov.in","Report the ad to the platform and the brand, and use the National Consumer Helpline (1915) for a consumer complaint"],rails:["UPI QR / Payment Gateway Links","Mule Current Accounts","Unregistered Gateways"],targets:["Students and young buyers","Deal hunters on social media","First-time online shoppers"],media:{type:"audio",title:"Reconstructed Helpline Call \xB7 Fake Brand Store Support Agent",duration:62,transcript:[{time:0,speaker:"Victim",text:"I ordered a branded TWS earbud for \u20B9285 from the sale site I saw on Instagram. The parcel finally came. It is a plain box with a cheap wired earphone."},{time:12,speaker:"Fake Support Agent (Brand Impersonator)",text:"Sir, the premium model is out of stock, so our system shipped an alternate model. A return needs a reverse pickup fee of \u20B9149."},{time:26,speaker:"Victim",text:"The website said free returns. Please refund my \u20B9285."},{time:34,speaker:"Fake Support Agent (Brand Impersonator)",text:"Sure. I am sending a refund link on WhatsApp. Open it, enter the amount and your UPI PIN to receive the refund."},{time:46,speaker:"Victim",text:"It says \u20B9285 will be debited from my account."},{time:52,speaker:"Fake Support Agent (Brand Impersonator)",text:"That is only a verification display, sir. Enter the PIN and the refund completes in one minute."}],iocs:{lookalike_domains:["boat-lifestyle-deals[.]shop (illustrative pattern)","official-boat-sale[.]in (illustrative pattern)"],ad_artifacts:["Sponsored ad: branded TWS earbuds at \u20B9285, 'limited time' timer","Buy-2-get-1-free banner that never expires"],support_contacts:["boatsupport.help24@gmail.com (illustrative free-mail support ID)","+91 98XXX 7XXXX (unverified helpline)"],payment_artifacts:["Merchant name on payment page differs from the brand, e.g. 'S* Enterprises'","No invoice or tracking ID after payment"]},legal_statutes:["BNS Sec 318(4) (Cheating)","BNS Sec 319(2) (Cheating by personation)","BNS Sec 336 (Forgery; fake website and documents)","IT Act Sec 66D (Cheating by personation using a computer resource)","Trade Marks Act, 1999 Sec 103 \xB7 104 (False trade marks; selling goods with false trade marks)","Consumer Protection (E-Commerce) Rules, 2020 (Seller disclosure and grievance duties)","Consumer Protection Act, 2019 Sec 2(47) (Unfair trade practice)"]}},{id:"IN-007",vector:"Device Compromise",severity:"high",title:"Fake Traffic Challan and Wedding Invitation APKs on WhatsApp",summary:"A WhatsApp message claims a pending traffic challan or carries a wedding invitation, but the attached file is an Android app that takes over the phone, reads OTPs and spreads itself to the victim's contacts.",red_flags:["File sent over chat ends in .apk, even if it is named like a challan, invitation, courier update or exam result","Message uses legal fear: pending challan, court notice, penalty with a deadline","Sender is an unsaved number, or a known contact whose WhatsApp account has been hijacked","App asks for SMS, Accessibility and notification permissions before it shows anything"],control_points:["Never open an .apk received on chat. Check challans only on the official Parivahan or state transport portal","Turn off 'install unknown apps' for WhatsApp and your browser in phone settings","If installed: airplane mode, uninstall, change banking and UPI credentials from another device, then call 1930","Warn your contacts at once if your account sent the file, and report the number on Sanchar Saathi Chakshu"],rails:["Sideloaded APKs","SMS Forwarding Trojans","UPI VPAs"],targets:["Vehicle owners","Families expecting wedding or event invitations","Senior WhatsApp users"],media:{type:"audio",title:"Reconstructed Call \xB7 Fake E-Challan Cell Agent",duration:70,transcript:[{time:0,speaker:"Fake RTO Officer",text:"Sir, this is the e-challan cell. A challan of \u20B9500 is pending on your vehicle for a signal violation. I have sent the photo evidence on WhatsApp."},{time:14,speaker:"Victim",text:"The file ends with .apk. It will not open as a photo."},{time:22,speaker:"Fake RTO Officer",text:"It is the official challan viewer. Install it, allow all permissions and pay \u20B9500 inside the app so that the court case is closed."},{time:36,speaker:"Victim",text:"It is asking for SMS and Accessibility permission."},{time:43,speaker:"Fake RTO Officer",text:"That is normal for security verification, sir. Please tap Allow."},{time:54,speaker:"Victim",text:"My phone is behaving strangely and WhatsApp has sent a message to all my contacts."},{time:62,speaker:"Fake RTO Officer",text:"That is a one-time sync. Do not uninstall the app until the payment clears."}],iocs:{malicious_files:["Challan_Notice_2026.apk","Wedding_Invitation_Sharma.apk"],malicious_packages:["com.rto.echallan.viewer","com.invite.digital.card"],sender_numbers:["+91 87XXX 31XXX","+91 63XXX 90XXX"],phishing_domains:["echallan-parivahan-pay[.]top"]},legal_statutes:["IT Act Sec 43 (Unauthorised access and damage to computer systems)","IT Act Sec 66 (Computer related offences)","IT Act Sec 66C (Identity theft)","IT Act Sec 66D (Cheating by personation using a computer resource)","BNS Sec 318(4) (Cheating)","BNS Sec 111 (Organised crime)"]}},{id:"IN-008",vector:"Investment Fraud",severity:"critical",title:"Deepfake-endorsed Stock Clubs and Fake Trading Apps",summary:"Victims are drawn into WhatsApp stock-tip groups, shown AI-generated videos of public figures endorsing a platform, and sent an app that displays fake profits. Withdrawals are blocked behind 'tax', 'margin' and 'clearance' payments.",red_flags:["Unsolicited WhatsApp group invitation promising guaranteed monthly returns or insider tips","Video endorsement by a public figure or celebrity that looks slightly off or cannot be found on official channels","Trading 'app' is installed from an APK or a link, not from the official app store, and the broker is not on the SEBI registry","Profits show on screen, but withdrawals need extra tax or margin payments to personal or current accounts"],control_points:["Check every broker, adviser and app on the SEBI registry before depositing; SEBI-registered intermediaries do not run guaranteed-return groups","Treat any video of a public figure promoting an investment as fake until confirmed on their official channel","Never pay a fee to withdraw your own money; stop and call 1930 within the first hours so the receiving accounts can be frozen","Banks should flag repeated high-value first-time transfers to new current accounts and add a cooling-off hold"],rails:["Corporate Current Mules","RTGS / NEFT","UPI VPAs","P2P Cryptocurrency (USDT)","Sideloaded APKs"],targets:["Retail investors","Salaried professionals","Homemakers and retirees","Social media users"],media:{type:"video",title:"Reconstructed Investor Webinar \xB7 Deepfake Endorsement and Fake Analyst",duration:70,transcript:[{time:0,speaker:"Deepfake Endorser (Cloned Public Figure)",text:"Citizens, a government-backed AI trading platform now offers guaranteed monthly returns. Seats are limited to the first thousand investors."},{time:14,speaker:"Scammer (Fake Analyst)",text:"Welcome to the VIP stock club. Download our app from the link and use my invitation code to open an institutional account."},{time:28,speaker:"Victim",text:"I deposited \u20B950,000 and the app shows \u20B91.2 lakh profit after a week. Can I withdraw?"},{time:40,speaker:"Scammer (Fake Analyst)",text:"Profits above \u20B91 lakh need a 20% tax prepayment to the clearing account first."},{time:52,speaker:"Victim",text:"I have paid, but now it asks for a risk margin fee."},{time:60,speaker:"Scammer (Fake Analyst)",text:"Pay it today or your account is locked and the profits lapse."}],iocs:{fake_apps:["VIPStockClub_Pro.apk (package com.vip.stockclub.pro)"],fake_portals:["gov-ai-trade[.]vip","institutional-quota-ipo[.]top"],invite_channels:["WhatsApp group: 'AI Stock Mentor 77'","Telegram channel: 'Pre-IPO Signals VIP'"],mule_current_accounts:["Acct: 70110XXXX5528 \xB7 IFSC FAKE0009021","Acct: 40880XXXX1930 \xB7 IFSC FAKE0004472"]},legal_statutes:["BNS Sec 318(4) (Cheating)","BNS Sec 319(2) (Cheating by personation)","BNS Sec 336(4) (Forgery for harming reputation; applies to deepfaked endorsements)","IT Act Sec 66C (Identity theft)","IT Act Sec 66D (Cheating by personation using a computer resource)","SEBI Act Sec 12(1) (Dealing in securities only through registered intermediaries)","SEBI Act Sec 12A (Prohibition of manipulative and deceptive devices)","Prevention of Money Laundering Act, 2002 Sec 3 (Offence of money laundering)"]}},{id:"IN-009",vector:"Extortion",severity:"high",title:"Sextortion Video Calls and Fake Cyber Police or Platform Takedown Calls",summary:"A stranger starts a video call that turns explicit and is secretly recorded. A second caller posing as cyber police or a video-platform official then demands money to stop the upload, and keeps asking after the first payment.",red_flags:["Unknown woman's profile pushes to a video call within minutes of a first message","Call cuts off abruptly and a threat of upload or an FIR follows within minutes","A 'police officer' or 'platform official' calls on WhatsApp or mobile, not through any formal notice","Repeated demands after payment, each with a new reason such as 'deletion fee' or 'refund certificate'"],control_points:["Do not pay. Payment does not stop the threat and usually leads to more demands","Do not delete anything. Save the chats, numbers, payment records and screenshots, then block and report the profile","Call 1930 and file at cybercrime.gov.in; real police do not ask for money to delete a video, and you can come forward without shame","Use the platform's reporting tool and take-down request for any posted material, and lock down your social media privacy settings"],rails:["UPI VPAs","Mule Accounts","Direct IMPS Transfers","Gift Cards and Wallets"],targets:["Men of all ages on social media and dating apps","Senior citizens","Professionals concerned about reputation","Students"],media:{type:"audio",title:"Reconstructed Follow-up Extortion Call \xB7 Fake Cyber Police and Platform Officer",duration:56,transcript:[{time:0,speaker:"Scammer (Fake Cyber Police Officer)",text:"A complaint has been registered against you. A video of you from a video call is with us and will be uploaded to a video platform."},{time:12,speaker:"Victim",text:"I did nothing. A stranger called me and I disconnected."},{time:20,speaker:"Scammer (Fake Cyber Police Officer)",text:"The recording exists. I will connect you to the platform compliance officer, who can remove it if you pay the deletion charge."},{time:32,speaker:"Scammer (Fake Platform Official)",text:"To block the upload, transfer \u20B925,000 to this account. After deletion, a refund certificate will be issued."},{time:44,speaker:"Victim",text:"I have paid. Please confirm that it is deleted."},{time:50,speaker:"Scammer (Fake Platform Official)",text:"A second copy has been found. Another \u20B940,000 is required."}],iocs:{caller_ids:["+91 79XXX 40XXX (initial video call)","+91 98XXX 66XXX (fake cyber police)"],suspect_handles:["Social profile with a stock photo of a woman and under 50 followers","WhatsApp account using a police logo as display picture"],upi_vpas:["ytsupport.cell@ybl","removal.fee.help@okaxis"],mule_accounts:["Acct: 2201XXXX8836 \xB7 IFSC FAKE0002380"]},legal_statutes:["BNS Sec 308 (Extortion)","BNS Sec 351 (Criminal intimidation)","BNS Sec 204 (Personating a public servant)","BNS Sec 319(2) (Cheating by personation)","IT Act Sec 66C (Identity theft)","IT Act Sec 66D (Cheating by personation using a computer resource)","IT Act Sec 66E \xB7 67 \xB7 67A (Privacy violation; obscene or sexually explicit material)"]}},{id:"IN-010",vector:"Impersonation",severity:"high",title:"Fake Customer Care Numbers from Search Results and Remote-access Takeover",summary:"Fraudsters list fake support numbers for banks, delivery apps and e-commerce sites in online search results. A victim who calls is guided to install a screen-sharing app, and the caller then moves money out of the account.",red_flags:["Support number found in a search result or map listing rather than on the company's own app or card","Agent asks you to install AnyDesk, QuickSupport or a similar screen-sharing app, or to read out a code from it","Agent asks you to open your banking app 'to verify the refund' or to 'send \u20B91 to confirm'","A refund process that requires you to enter a PIN or approve a collect request"],control_points:["Get customer care numbers only from the official app, the card or the website that you typed in yourself","Never install a screen-sharing app at a stranger's request; if you did, end the call, switch on airplane mode and call 1930","A refund never needs a PIN, OTP or approval; if one is required, it is a payment from you","Banks should alert customers on first-time remote-access sessions and delay new-payee transfers made during one"],rails:["Remote Access Tools","UPI VPAs","Direct IMPS Transfers"],targets:["Customers with a refund or delivery problem","Senior citizens","First-time online shoppers"],media:{type:"audio",title:"Reconstructed Call \xB7 Fake Customer Care Agent and Screen-sharing Request",duration:62,transcript:[{time:0,speaker:"Victim",text:"I found this customer care number on a search page. My food delivery refund of \u20B9349 is pending."},{time:10,speaker:"Scammer (Fake Customer Care Agent)",text:"Sir, I will process it now. Install QuickSupport from the app store so I can see your order screen."},{time:22,speaker:"Victim",text:"It shows a code. Should I read it to you?"},{time:28,speaker:"Scammer (Fake Customer Care Agent)",text:"Yes, read the nine digit code. Now open your bank app so I can verify the refund account."},{time:40,speaker:"Victim",text:"The app is asking for my UPI PIN."},{time:46,speaker:"Scammer (Fake Customer Care Agent)",text:"Just enter it for the refund. I will not look."},{time:54,speaker:"Victim",text:"\u20B949,000 has been debited from my account!"}],iocs:{fake_numbers:["+91 99XXX 12XXX (listed as 'customer care' in search results)"],remote_access_apps:["QuickSupport session initiated at the caller's request","AnyDesk code shared by the victim"],phishing_domains:["support-refund-help[.]online"],mule_accounts:["Acct: 8820XXXX4107 \xB7 IFSC FAKE0006655"]},legal_statutes:["IT Act Sec 43 (Unauthorised access and damage to computer systems)","IT Act Sec 66 (Computer related offences)","IT Act Sec 66C (Identity theft)","IT Act Sec 66D (Cheating by personation using a computer resource)","BNS Sec 318(4) (Cheating)","BNS Sec 319(2) (Cheating by personation)"]}},{id:"IN-011",vector:"Employment & Mule Fraud",severity:"high",title:"Fake Job Offers that Recruit Money Mules and Rent Bank Accounts",summary:"Recruiters offer work-from-home jobs or one-time bonuses for opening accounts, handing over SIMs or forwarding payments. The accounts are used to launder proceeds of other scams, and the account holder is the first person the police find.",red_flags:["Job offer that pays well for 'receiving and forwarding client payments' or for opening a new account","Request to hand over a SIM, cheque book, debit card or net banking login, or to open a current account for a business that does not exist","Instruction to tell the bank a made-up reason for the account or for large credits","Commission per account you bring in, paid in cash or UPI, and recruiters who only use messaging apps"],control_points:["Never sell, rent or lend your bank account, SIM, Aadhaar-linked details or company registration to anyone","A genuine employer never asks you to move other people's money; stop and walk away from such offers","If your account already received suspect money, do not withdraw or forward it; tell your bank and file at cybercrime.gov.in","Banks should review accounts that open and receive large credits quickly, and verify business details at current-account opening"],rails:["Mule Current Accounts","UPI VPAs","Direct IMPS Transfers","P2P Cryptocurrency (USDT)"],targets:["Unemployed youth and students","Low-income workers","Homemakers","Gig workers"],media:{type:"audio",title:"Reconstructed Recruiter Call \xB7 Fake HR Offer to Open and Hand Over Accounts",duration:58,transcript:[{time:0,speaker:"Scammer (Fake HR Recruiter)",text:"Work from home, \u20B930,000 a month. Your job is to receive client payments in your savings account and forward them."},{time:12,speaker:"Victim",text:"Is it legal? What do I have to do?"},{time:18,speaker:"Scammer (Fake HR Recruiter)",text:"Totally legal. Open a new account, hand over the SIM, cheque book and net banking login, and you get a \u20B95,000 joining bonus."},{time:34,speaker:"Victim",text:"A friend said I could be arrested if my account is used for fraud."},{time:42,speaker:"Scammer (Fake HR Recruiter)",text:"Do not worry. If the bank asks, say it is for your small business. You also get \u20B93,000 for every friend you bring."}],iocs:{recruiter_handles:["Telegram: @HR_RemoteDesk_India","WhatsApp: '+91 90XXX 22XXX (Talent Partner)'"],entity_artifacts:["Current account in the name of a non-existent business, e.g. 'M/s Shree Trading Co'","Forged rent agreement used as address proof"],account_pattern:["New account with large inbound UPI credits and same-day outbound transfers"],sim_artifacts:["Multiple SIMs issued against one Aadhaar and handed to a third party"]},legal_statutes:["BNS Sec 61 (Criminal conspiracy)","BNS Sec 111 (Organised crime)","BNS Sec 317 (Stolen property; receiving or retaining)","BNS Sec 336 (Forgery; fake documents for account opening)","IT Act Sec 66D (Cheating by personation using a computer resource)","Prevention of Money Laundering Act, 2002 Sec 3 \xB7 4 (Money laundering and its punishment)"]}},{id:"IN-012",vector:"Phishing & Account Takeover",severity:"high",title:"KYC Update, Reward Points and OTP Phishing",summary:"A call or SMS claims your account, PAN or card will be blocked unless you update KYC or redeem points. A link or app captures your credentials, and an OTP you read out approves a payment you never made.",red_flags:["Urgent message about blocking, expiry or reward points with a link or an attached app","Caller asks you to read an OTP 'for verification', and the OTP message actually names a payment amount","Link leads to a lookalike bank page that asks for card number, CVV, net banking login and PIN","Sudden loss of mobile signal, which can mean a SIM swap in progress"],control_points:["Update KYC only inside your bank's own app or branch; banks do not ask for it through links or chat apps","Never share an OTP, PIN, CVV or password; read the OTP SMS fully for the amount and merchant first","If the network drops without reason, call your operator and bank at once and block your cards and UPI","Banks should enforce transaction limits on newly changed devices or SIMs and alert the customer before large payments"],rails:["Card-not-present (OTP)","UPI VPAs","Sideloaded APKs","Direct IMPS Transfers"],targets:["Credit card and savings account holders","Senior citizens","Salaried professionals"],media:{type:"audio",title:"Reconstructed Call \xB7 Fake Bank KYC Executive Requesting an OTP",duration:54,transcript:[{time:0,speaker:"Scammer (Fake Bank Executive)",text:"This is the KYC department. Your account will be blocked today because your PAN is not updated."},{time:10,speaker:"Victim",text:"I updated my KYC last year."},{time:16,speaker:"Scammer (Fake Bank Executive)",text:"The system shows it as pending. I am sending a link to update it in two minutes."},{time:26,speaker:"Victim",text:"I got an OTP message."},{time:30,speaker:"Scammer (Fake Bank Executive)",text:"Read the OTP so I can complete the verification. It is not a payment."},{time:38,speaker:"Victim",text:"The message says the OTP is for a \u20B989,000 transaction."},{time:46,speaker:"Scammer (Fake Bank Executive)",text:"That is only a system test, sir. Please share it."}],iocs:{sms_senders:["VK-KYCUPD (lookalike header)","+91 81XXX 50XXX"],phishing_domains:["bank-kyc-update[.]co","rewards-redeem-points[.]top"],malicious_files:["BankRewards_KYC.apk"],caller_ids:["+91 11 4XXX 0099 (spoofed bank helpline)"]},legal_statutes:["IT Act Sec 43 (Unauthorised access and damage to computer systems)","IT Act Sec 66C (Identity theft)","IT Act Sec 66D (Cheating by personation using a computer resource)","BNS Sec 318(4) (Cheating)","BNS Sec 319(2) (Cheating by personation)","RBI circular on customer liability in unauthorised electronic banking transactions (6 July 2017)"]}},{id:"IN-013",vector:"Payment Fraud",severity:"high",title:"'I'm nearby, scan this QR to receive payment': fake service-booking calls to businesses",summary:"A caller phones a shop, salon, tailor, caterer, clinic, repair or taxi business, says he needs the service and is somewhere close by, offers an advance, and sends a QR code to 'receive' it. Scanning the code and entering the PIN pays the fraudster instead.",red_flags:["Caller needs an urgent service, says he is 'nearby', and offers to pay an advance before he arrives","Insists on a QR code or collect request instead of a bank transfer, cash on arrival or your own UPI ID","Sends a QR image on WhatsApp and says 'scan to receive'; a \u20B91 or \u20B95 test code often comes first","Gets impatient, repeats the request or video-calls if you hesitate, and may claim an army or VIP posting"],control_points:["A QR code is only for paying. Never scan a code a customer sends you in order to receive money","Give your own UPI ID or show your shop's QR so the customer pays you; never enter your PIN to 'receive'","Confirm the credit in your bank SMS or app, not in a screenshot, before you start the work or release goods","If you have scanned one, stop, call your bank and 1930 within minutes, and file at cybercrime.gov.in"],rails:["UPI QR / Collect Request","Paytm / PhonePe Wallets","Mule Accounts"],targets:["Small shop owners","Salons, tailors and caterers","Clinics and repair technicians","Cab and tempo operators"],media:{type:"audio",title:"Reconstructed Call \xB7 Fake Customer Booking at a Small Business",duration:60,transcript:[{time:0,speaker:"Scammer (Fake Customer)",text:"Hello, is this the tailoring shop? I need ten kurtas stitched urgently. I am near your market right now."},{time:9,speaker:"Victim (Shop Owner)",text:"Yes sir, bring the cloth and we will take the measurements."},{time:17,speaker:"Scammer (Fake Customer)",text:"I cannot come immediately. I will pay the advance first so that you start. Which Google Pay number do you use?"},{time:28,speaker:"Victim (Shop Owner)",text:"The same number you called."},{time:34,speaker:"Scammer (Fake Customer)",text:"I am sending a QR code on WhatsApp. Scan it to receive the two thousand rupee advance."},{time:45,speaker:"Victim (Shop Owner)",text:"It is asking for my UPI PIN, and it says I am paying two thousand rupees."},{time:53,speaker:"Scammer (Fake Customer)",text:"That is how the new system confirms the receiver. Enter the PIN and the money will come in two minutes. I am standing outside your market."},{time:66,speaker:"Victim (Shop Owner)",text:"My account has been debited two thousand rupees. Nothing has come in."},{time:76,speaker:"Scammer (Fake Customer)",text:"Sorry, wrong code. I will send another one for four thousand and everything will be returned together."}],iocs:{qr_payloads:["upi://pay?pa=advance.booking21@okaxis&pn=ADVANCE%20REFUND&am=2000&cu=INR (illustrative pattern)"],caller_ids:["+91 70XXX 11XXX (prepaid number, calls several shops in one area)"],upi_vpas:["advance.booking21@okaxis","booking.advance.pay@ybl"],whatsapp_artifacts:["Profile photo of an army uniform or a blank DP","QR image sent right after the call"],mule_accounts:["Acct: 6602XXXX3045 \xB7 IFSC FAKE0008810"]},legal_statutes:["BNS Sec 318(4) (Cheating)","BNS Sec 319(2) (Cheating by personation)","IT Act Sec 66C (Identity theft)","IT Act Sec 66D (Cheating by personation using a computer resource)","Payment and Settlement Systems Act, 2007 (Governs UPI operators and grievance redressal)"]}},{id:"IN-014",vector:"Impersonation",severity:"critical",title:"'Drugs in your parcel': fake courier, customs and Mumbai police chain",summary:"An automated or live call claims a courier parcel in your name, bound for Taiwan or Thailand, holds drugs, passports and cards. The call is passed to 'customs' and then 'Mumbai cyber police' on Skype or WhatsApp, who ask for money for 'RBI verification'.",red_flags:["Courier call about a parcel you never booked, mentioning your Aadhaar or phone number","Hand-off from 'customer care' to 'customs', then to 'police' or 'CBI' within a single call","Skype or WhatsApp video call with a uniformed officer and papers with RBI or police letterheads","Order to stay on the line, tell no one, and move savings to an 'RBI verification account'"],control_points:["Hang up. A courier company does not hand you to the police, and no agency arrests anyone on Skype","Call the courier only on the number printed on its official website, never one given by the caller","Do not send money to any 'verification' account; call 1930 at once if you have, and file at cybercrime.gov.in","Banks should flag large first-time transfers by retail customers who are on a call and may be coached"],rails:["IMPS / RTGS","UPI VPAs","Mule Current Accounts"],targets:["Working professionals","Women living alone","Senior citizens","Online shoppers"],media:{type:"audio",title:"Reconstructed Call \xB7 Fake Courier, Customs and Mumbai Police Hand-off",duration:60,transcript:[{time:0,speaker:"Scammer (Fake Courier Executive)",text:"This is the courier customer care. A parcel booked from your Aadhaar number to Taiwan has been stopped at Mumbai airport. It contains drugs, passports and credit cards."},{time:14,speaker:"Victim",text:"I have not sent any parcel. I have never been to the airport."},{time:22,speaker:"Scammer (Fake Customs Officer)",text:"Madam, a case under the narcotics law is registered in your name. I am connecting you to the Mumbai cyber crime police on Skype."},{time:36,speaker:"Scammer (Fake Mumbai Police)",text:"Your Aadhaar is being misused. To prove that you are innocent, you must transfer your money to the Reserve Bank verification account. It will be returned after the check."},{time:52,speaker:"Victim",text:"How much should I send?"},{time:58,speaker:"Scammer (Fake Mumbai Police)",text:"All savings, now. Do not tell your family or the bank, because that will weaken your case."}],iocs:{caller_ids:["+91 22 4XXX 7XXX (spoofed Mumbai number)","Automated call that starts with 'press 1' for customer care"],messaging_handles:["Skype ID: mumbai.cybercell.verify (illustrative)","WhatsApp profile with a police uniform photo"],forged_documents:["'RBI clearance letter' and 'NDPS case notice' PDFs with stock seals"],mule_accounts:["Acct: 4410XXXX7621 \xB7 IFSC FAKE0003391","Acct: 3068XXXX1290 \xB7 IFSC FAKE0007725"]},legal_statutes:["BNS Sec 318(4) (Cheating)","BNS Sec 319(2) (Cheating by personation)","BNS Sec 204 (Personating a public servant)","BNS Sec 308 \xB7 351 (Extortion; criminal intimidation)","IT Act Sec 66C (Identity theft)","IT Act Sec 66D (Cheating by personation using a computer resource)"]}},{id:"IN-015",vector:"Impersonation",severity:"high",title:"AI-cloned voice of a relative: urgent surgery or accident money request",summary:"A call in the cloned voice of a cousin, uncle or friend says a friend has had a heart attack or an accident and needs money at once, to be sent by QR code or UPI. The voice is generated from a short public clip.",red_flags:["Unknown number or a stranger's WhatsApp account, but the voice sounds like a relative","A medical, accident or police emergency that leaves no time to call back","Payment requested by QR code or UPI to a third person's account, in several instalments","The caller cannot answer a personal question and the number is switched off afterwards"],control_points:["Hang up and call the relative on the number you have saved, or ask another family member","Agree a family code word that a real caller can give and a clone cannot","Do not send money in instalments to an unknown account, whatever the voice sounds like","Report the number and the recipient accounts on 1930 straight away; banks can freeze accounts if told quickly"],rails:["UPI QR Codes","UPI VPAs","Mule Accounts"],targets:["Parents and grandparents","Small business owners","Teachers and salaried staff"],media:{type:"audio",title:"Reconstructed Call \xB7 Cloned Voice of a Relative",duration:55,transcript:[{time:0,speaker:"Scammer (Cloned Voice of Relative)",text:"Didi, it is me. My friend has had a heart attack and needs surgery in a private hospital right now. I cannot talk for long."},{time:14,speaker:"Victim",text:"Is it really you? Your voice sounds a little different."},{time:22,speaker:"Scammer (Cloned Voice of Relative)",text:"The network is bad and the hospital is noisy. Please send money on the QR code I am sharing. The doctor is waiting for the payment."},{time:38,speaker:"Victim",text:"I have sent \u20B925,000. Is that enough?"},{time:46,speaker:"Scammer (Cloned Voice of Relative)",text:"They need more for the operation. Send another \u20B930,000 and I will return everything tonight."}],iocs:{caller_ids:["+91 90XXX 33XXX (new number, not in the victim's contacts)"],qr_and_vpas:["Third-party QR code sent by message","emergency.hospital.pay@ybl (illustrative)"],voice_artifacts:["Voice sample scraped from social media video or reel","Short, repeated phrases and a request to stay on the call"],mule_accounts:["Acct: 7715XXXX2208 \xB7 IFSC FAKE0001198"]},legal_statutes:["BNS Sec 318(4) (Cheating)","BNS Sec 319(2) (Cheating by personation)","IT Act Sec 66C (Identity theft)","IT Act Sec 66D (Cheating by personation using a computer resource)","Digital Personal Data Protection Act, 2023 (Misuse of personal data and likeness)"]}},{id:"IN-016",vector:"Impersonation",severity:"high",title:"Fake TRAI / DoT call: 'your number will be disconnected in two hours'",summary:"A pre-recorded call claims to be from the telecom regulator and says your number will be cut for illegal activity. Pressing a key connects you to a fake officer who passes you to a fake cyber police officer, often ending in a digital arrest or a transfer demand.",red_flags:["Automated call threatening disconnection within hours, often from a foreign WhatsApp number such as +92","Asks you to press a key or speak to a 'TRAI officer' to avoid blocking","Claims your SIM is linked to harassment, money laundering or illegal parcels","Escalates to police or CBI on video and asks for Aadhaar, OTPs or money"],control_points:["TRAI and DoT do not call to threaten disconnection; any such call is fake, so hang up","Disconnections for KYC, billing or misuse come from your own telecom operator, so check with them","Report the number on the Chakshu facility of Sanchar Saathi and, if money moved, call 1930","Check the SIM cards issued in your name on Sanchar Saathi and block any you do not use"],rails:["UPI VPAs","IMPS / RTGS","Mule Accounts"],targets:["Mobile users","Senior citizens","First-time smartphone users"],media:{type:"audio",title:"Reconstructed Call \xB7 Pre-recorded 'Disconnection' Call and Fake Officer",duration:55,transcript:[{time:0,speaker:"Scammer (Automated Voice)",text:"This is an important message from the telecom authority. Your mobile number will be disconnected in two hours because of illegal activity. Press 1 to speak to an officer."},{time:14,speaker:"Victim",text:"I pressed 1. What illegal activity? I have used this number for ten years."},{time:24,speaker:"Scammer (Fake TRAI Officer)",text:"A SIM issued on your Aadhaar was used for harassment calls in Mumbai. A police complaint is registered. I am connecting you to the cyber crime officer on video."},{time:40,speaker:"Scammer (Fake Cyber Police Officer)",text:"To clear your name, share your Aadhaar and the OTP that you will get now. Do not disconnect this call."},{time:52,speaker:"Victim",text:"The OTP is on my phone. Should I read it out?"}],iocs:{caller_ids:["+92 3XX XXXXXXX (foreign WhatsApp call)","Pre-recorded call from a masked number"],impersonated_bodies:["TRAI","DoT","Mumbai Cyber Crime Cell"],phishing_artifacts:["Request for Aadhaar number and OTP","Skype or WhatsApp video call with uniformed 'officer'"]},legal_statutes:["BNS Sec 319(2) (Cheating by personation)","BNS Sec 204 (Personating a public servant)","BNS Sec 318(4) (Cheating)","Telecommunications Act, 2023 Sec 42 (Offences relating to telecommunication identity and misuse)","IT Act Sec 66D (Cheating by personation using a computer resource)"]}},{id:"IN-017",vector:"Payment Fraud",severity:"medium",title:"Merchant QR sticker swap: fake QR pasted over a shop's payment code",summary:"A fraudster pastes their own UPI QR over a shop's, a petrol pump's or a vendor's code, often at night. Customers pay without noticing the payee name, and the money goes to the fraudster until the shopkeeper sees that nothing is arriving.",red_flags:["Shop owner sees several customer payments that never arrive in the account or on the soundbox","Payee name on the scanning screen is an individual's name, not the shop's name","Sticker edges, bubbles or a slightly different size over the original QR","CCTV shows a person pasting something on the counter or board when the shop was closed"],control_points:["Customers: read the payee name on the UPI screen before entering the PIN, and ask the shop to confirm it","Shops: inspect the QR every morning and evening, use a bank soundbox, and keep the code behind the counter or inside a stand","If the wrong payee was paid, tell the UPI app and bank at once and file at cybercrime.gov.in; the bank can freeze the beneficiary account","Banks and payment apps should flag a merchant QR whose receiving account name differs from the shop name"],rails:["UPI QR Codes","UPI VPAs","Mule Accounts"],targets:["Kirana and tea stalls","Medical shops and petrol pumps","Street vendors","Auto and cab drivers"],media:{type:"audio",title:"Reconstructed Conversation \xB7 Customer Notices a Different Payee Name",duration:55,transcript:[{time:0,speaker:"Customer (Genuine)",text:"Bhaiya, I paid \u20B9350 on your QR, but the payment screen showed a different name."},{time:9,speaker:"Victim (Pharmacy Owner)",text:"A different name? That is not my account. Let me look at the counter."},{time:19,speaker:"Victim (Pharmacy Owner)",text:"Someone has pasted a new QR sticker over mine. Seven customers have paid today and I have received nothing."},{time:34,speaker:"Genuine Bank Helpline",text:"Sir, no payment is shown against your account. The money went to another beneficiary. Please note the transaction IDs, call 1930 and file a police complaint."},{time:52,speaker:"Victim (Pharmacy Owner)",text:"I will check the camera footage. Customers, please read the payee name before you pay."}],iocs:{tampered_artifacts:["Sticker pasted over the original QR with visible edges","QR whose payee shows an individual's name"],upi_vpas:["tiwari.chhotu.pay@ybl (illustrative pattern)"],cctv_artifacts:["Masked person pasting a code at the counter late at night"],payment_pattern:["Many small payments to one personal VPA in a market area"]},legal_statutes:["BNS Sec 318(4) (Cheating)","BNS Sec 336 (Forgery; fake merchant code)","BNS Sec 316 (Criminal breach of trust; where an employee swaps the store's QR)","IT Act Sec 66D (Cheating by personation using a computer resource)","Payment and Settlement Systems Act, 2007 (Governs UPI operators and grievance redressal)"]}},{id:"IN-018",vector:"Payment Fraud",severity:"medium",title:"Fake 'payment successful' screen: goods taken without real payment",summary:"A customer scans a shop's QR but shows a faked or screen-recorded 'payment successful' screen, picks up the goods and leaves before the shopkeeper checks the bank account.",red_flags:["Customer shows a green tick and hurries to leave, often because of a train or a meeting","No bank SMS, soundbox announcement or app notification arrives","The confirmation screen has odd timing, wrong fonts or a short animation instead of a bank reference","Payment shown for a different amount, payee or date"],control_points:["Release goods only after your bank SMS, app notification or soundbox confirms the credit","Ask for the transaction reference and check it in your bank app, not on the customer's phone","Use a soundbox or merchant app that announces credits from the bank's own system","Report repeat offenders to the local police and file the details on cybercrime.gov.in"],rails:["UPI QR Codes","UPI VPAs"],targets:["Electronics and mobile shops","Kirana stores","Jewellers and tailors","Delivery staff"],media:{type:"audio",title:"Reconstructed Conversation \xB7 Fake Success Screen at a Shop Counter",duration:50,transcript:[{time:0,speaker:"Scammer (Fake Customer)",text:"Bhaiya, give me the charger and cable set for \u20B94,800. I will pay by QR."},{time:10,speaker:"Victim (Shop Owner)",text:"Please scan the code and show me the confirmation."},{time:18,speaker:"Scammer (Fake Customer)",text:"Done. See the green tick and the words payment successful."},{time:27,speaker:"Victim (Shop Owner)",text:"The screen shows success, but my soundbox has not spoken. Let me check my message."},{time:37,speaker:"Scammer (Fake Customer)",text:"The server is slow, sir, the money will come. I am late for my train. Please give me the goods now."},{time:48,speaker:"Victim (Shop Owner)",text:"I will wait until the bank message arrives."}],iocs:{fake_confirmation:["Screen recording or simulator app that shows a green tick","No transaction reference matching a bank record"],behaviour_patterns:["Customer is in a hurry and avoids showing the bank app","Same customer visits several shops in one area"],verification_gaps:["No soundbox announcement","No bank SMS within 30 seconds"]},legal_statutes:["BNS Sec 318(4) (Cheating)","BNS Sec 336 (Forgery; fake payment confirmation)","IT Act Sec 66D (Cheating by personation using a computer resource)","IT Act Sec 66 (Computer related offences)"]}},{id:"IN-019",vector:"Payment Fraud",severity:"medium",title:"'Sent by mistake, please return it': fake wrong-transfer refund demand",summary:"A stranger sends a small or large credit to your account, then calls or messages to say it was a mistake and asks you to return it to a different account or by a QR or collect request. The credit may be fake, reversible or stolen money, leaving you out of pocket or exposed.",red_flags:["Unexpected credit followed by an immediate call or message saying it was sent by mistake","Request to return the money to a different UPI ID or by scanning a QR or approving a collect request","Emotional pressure such as a hospital need, or a threat to complain to the police","Credit that comes from a name unknown to you and later reverses or is flagged by the bank"],control_points:["Do not return money yourself. Ask the sender to raise a reversal request with their bank or on the NPCI dispute mechanism","Tell your own bank about the unexpected credit and let it handle the recall","Never scan a QR code or approve a collect request to 'refund' someone","If the credit was proceeds of fraud, your account can be frozen, so report it on 1930 and keep the messages"],rails:["UPI VPAs","UPI Collect Request","Mule Accounts"],targets:["Anyone with a UPI ID","Students and gig workers","Small business owners"],media:{type:"audio",title:"Reconstructed Call \xB7 Fake Wrong-transfer Refund Demand",duration:60,transcript:[{time:0,speaker:"Scammer (Fake Sender)",text:"Sir, I sent \u20B95,000 by mistake to your number. Please return it right now, it is for my mother's medicine."},{time:12,speaker:"Victim",text:"I can see \u20B95,000 in my account. Let me send it back to your number."},{time:21,speaker:"Scammer (Fake Sender)",text:"Please do not send it to the same account, my bank app is failing. Send it to this other UPI ID."},{time:31,speaker:"Victim",text:"Why not the same one? The credit came from a different name."},{time:40,speaker:"Scammer (Fake Sender)",text:"It is an emergency, sir. If you do not send it, I will complain to the police that you kept my money."},{time:52,speaker:"Genuine Bank Officer",text:"Sir, do not return the money yourself. The credit may be stolen money or a fake credit that reverses. Ask the sender to raise a request with their bank, and report on 1930."}],iocs:{credit_pattern:["Credit from an unknown name followed within minutes by a call","Credit later reversed or flagged by the bank"],refund_instructions:["Request to pay a different UPI ID than the sender's","QR code or collect request sent as the 'refund' route"],upi_vpas:["refund.mistake.help@okaxis (illustrative)","return.payment.fast@ybl (illustrative)"],mule_accounts:["Acct: 5503XXXX6174 \xB7 IFSC FAKE0004407"]},legal_statutes:["BNS Sec 318(4) (Cheating)","BNS Sec 319(2) (Cheating by personation)","BNS Sec 111 (Organised crime)","IT Act Sec 66D (Cheating by personation using a computer resource)","Prevention of Money Laundering Act, 2002 Sec 3 (Laundering through third-party accounts)"]}},{id:"IN-020",vector:"Device Compromise",severity:"critical",title:"SIM swap: duplicate SIM issued, OTPs hijacked, accounts emptied overnight",summary:"Fraudsters learn your bank and SIM details, get a duplicate SIM or a port-out approved with forged documents or an insider's help, then receive your OTPs and move large sums overnight while your phone shows no signal.",red_flags:["Call or SMS asking for the 20-digit number printed on your SIM, or to press a key for a 'SIM upgrade'","Sudden loss of network on your number, often at night, with no warning from your operator","SMS about a SIM change, port-out request or new device that you did not make","Net-banking or UPI activity, new beneficiaries and big transfers reported soon after the signal dropped"],control_points:["Never share your SIM number or confirmation codes with callers; operators do not ask for them","If the signal drops without reason, use another phone to call your operator and bank immediately and block accounts, UPI and cards","Check the connections issued in your name on Sanchar Saathi and report any you do not recognise","Banks and telecom operators should add cooling-off holds on high-value transfers after a SIM change and verify duplicate-SIM requests carefully"],rails:["IMPS / RTGS","UPI VPAs","Mule Accounts"],targets:["Businessmen and traders","High-balance account holders","Retired professionals","Small company accounts"],media:{type:"audio",title:"Reconstructed Call \xB7 Fake Telecom 'SIM Upgrade' and the Night After",duration:60,transcript:[{time:0,speaker:"Scammer (Fake Telecom Executive)",text:"Sir, this is your network's customer care. Your SIM must be upgraded today or it will be blocked. Please tell me the twenty digit number printed on your SIM."},{time:15,speaker:"Victim",text:"It is on the back of the SIM card. Why do you need it?"},{time:24,speaker:"Scammer (Fake Telecom Executive)",text:"It is only for the upgrade, sir. When you get a confirmation message, please press 1."},{time:36,speaker:"Victim",text:"My phone has had no network since midnight, and my bank app shows \u20B94.2 lakh transferred out during the night."},{time:49,speaker:"Genuine Telecom Store Staff",text:"Sir, a duplicate SIM was issued on your number at 11:30 last night. Please block all your accounts at once and call 1930."}],iocs:{caller_ids:["+91 11 4XXX 3XXX (spoofed 'customer care')"],sim_artifacts:["Request for the 20-digit SIM number (ICCID)","Duplicate SIM issued late at night with forged ID or insider help"],account_activity:["Internet banking activated on a number with new SIM","RTGS or NEFT transfers to many accounts in different states"],mule_accounts:["Acct: 3302XXXX7714 \xB7 IFSC FAKE0002871","Acct: 6190XXXX2031 \xB7 IFSC FAKE0005503"]},legal_statutes:["IT Act Sec 66C (Identity theft)","IT Act Sec 66D (Cheating by personation using a computer resource)","IT Act Sec 43 \xB7 66 (Unauthorised access; computer related offences)","BNS Sec 318(4) (Cheating)","BNS Sec 336 (Forgery; forged documents to obtain a SIM)","BNS Sec 61 (Criminal conspiracy)","Telecommunications Act, 2023 Sec 42 (Identity fraud and misuse of telecom services)"]}},{id:"IN-021",vector:"Device Compromise",severity:"high",title:"'PM Kisan Yojana' and 'PM Awas' APKs that hijack phones and WhatsApp",summary:"A file named after a government scheme such as PM Kisan or PM Awas is shared in WhatsApp groups. Installing it takes over the phone, reads banking messages and forwards the same file to the victim's contacts and groups.",red_flags:["A government scheme 'app' that arrives as an .apk file in a WhatsApp group or message","Filenames such as 'PM Kisan Yojana v12.apk' or 'PM Awas Yojana.apk' with a size of a few MB","Phone overheats, shuts down or becomes unusable soon after installing","Your contacts receive the same file from your number, and bank debits follow"],control_points:["Register for government schemes only on the official portal or through your local agriculture or panchayat office","Never install an APK from a group or link, and turn off 'install unknown apps' for WhatsApp and your browser","If installed: switch off mobile data, uninstall, change passwords from another phone, and call 1930","Village-level officials and group admins should warn members and delete the file from groups"],rails:["Sideloaded APKs","UPI VPAs","SMS Forwarding Trojans"],targets:["Farmers and rural users","WhatsApp group members","Government scheme beneficiaries"],media:{type:"audio",title:"Reconstructed Group Voice Note \xB7 Fake Scheme App and the Aftermath",duration:55,transcript:[{time:0,speaker:"Scammer (Fake Scheme Helper)",text:"Farmer brother, your PM Kisan instalment is pending. Download the Kisan Yojana app from the file in this group so that the money can be released."},{time:14,speaker:"Victim",text:"The file name ends with dot apk. It is not on the Play Store."},{time:22,speaker:"Scammer (Fake Scheme Helper)",text:"It is the new version, only for registered farmers. Install it and allow all permissions."},{time:34,speaker:"Victim",text:"My phone has started heating and shutting down, and my contacts say they got the same file from me."},{time:45,speaker:"Victim",text:"Now \u20B91.95 lakh has been debited from my account."},{time:52,speaker:"Genuine Cyber Police Helpline",text:"Switch off mobile data, uninstall the file, change your passwords from another phone and call 1930."}],iocs:{malicious_files:["PM Kisan Yojana v12.apk (about 8.5 MB)","PM_Awas_Yojana.apk"],spread_pattern:["File auto-forwarded to all contacts and groups from the victim's WhatsApp"],device_symptoms:["Overheating and repeated shutdowns","Cannot operate the phone after install"],sender_numbers:["+91 88XXX 42XXX (group admin or unknown member)"]},legal_statutes:["IT Act Sec 43 (Unauthorised access and damage to computer systems)","IT Act Sec 66 (Computer related offences)","IT Act Sec 66C \xB7 66D (Identity theft; cheating by personation)","BNS Sec 318(4) (Cheating)","BNS Sec 319(2) (Cheating by personation)","BNS Sec 111 (Organised crime)"]}},{id:"IN-022",vector:"Device Compromise",severity:"high",title:"WhatsApp account hijack: the 'I sent you a code by mistake' trick",summary:"A contact, or a stranger posing as one, asks you to forward a six-digit WhatsApp verification code or to scan a QR code. The attacker then logs in on their own device, locks you out, and messages your contacts for urgent money.",red_flags:["A message saying 'I sent a code to your number by mistake, please send it back'","A QR code or link that promises a prize, a job or a 'verification' and asks you to scan it","WhatsApp suddenly logs you out, or says the number is registered on another phone","Friends tell you that you asked them for urgent money or sent them a file"],control_points:["Never share a WhatsApp verification code, even with someone you know; WhatsApp does not need it back","Turn on two-step verification and check 'Linked devices' regularly","If hijacked: reinstall WhatsApp and re-register with your number, warn your contacts, and report on 1930 and in the app","Contacts should verify any money request by a call before sending anything"],rails:["UPI VPAs","UPI QR Codes","Mule Accounts"],targets:["Everyday WhatsApp users","Senior citizens","People in many contact groups"],media:{type:"audio",title:"Reconstructed Chat Voice Notes \xB7 WhatsApp Code Hijack",duration:60,transcript:[{time:0,speaker:"Scammer (Fake Friend on WhatsApp)",text:"Hi, I sent a six digit code to your number by mistake. Can you send it back? It is urgent."},{time:12,speaker:"Victim",text:"It says do not share this code with anyone."},{time:19,speaker:"Scammer (Fake Friend on WhatsApp)",text:"It is for my account recovery. Please just forward it, you will help me a lot."},{time:30,speaker:"Victim",text:"I have sent it. Now WhatsApp has logged me out, and my friends say I asked them for money."},{time:43,speaker:"Scammer (Hijacker Messaging Contacts)",text:"I am in a hospital emergency. Please send \u20B915,000 to this number now, and I will return it tonight."},{time:56,speaker:"Genuine Cyber Cell Officer",text:"Report the account in WhatsApp, turn on two-step verification when you regain access, warn your contacts and call 1930."}],iocs:{sender_patterns:["Message from a saved contact whose account is already hijacked","Request to forward a six-digit code"],qr_and_links:["'Scan to verify' QR code that links a new device","APK or link sent from the hijacked account"],account_symptoms:["Logged out of WhatsApp","Linked device you do not recognise"],payment_requests:["Urgent money requests to contacts from the hijacked number","UPI IDs of third parties given as 'friend's account'"]},legal_statutes:["IT Act Sec 66C (Identity theft)","IT Act Sec 66D (Cheating by personation using a computer resource)","IT Act Sec 43 \xB7 66 (Unauthorised access; computer related offences)","BNS Sec 318(4) (Cheating)","BNS Sec 319(2) (Cheating by personation)"]}},{id:"IN-023",vector:"Extortion",severity:"high",title:"AI-morphed obscene images used to blackmail women and students",summary:"A fake recruiter or stranger collects photos and a short video call, uses AI tools to turn them into obscene images, and demands money to delete them. Payment rarely ends it: demands repeat, and victims are pushed to give other women's contacts.",red_flags:["A job, modelling or 'shortlisting' offer that asks for photos and a video call early on","An obscene image of you that you never shared, sent from an unknown number with a deletion price","Repeat demands after payment, or pressure to share contacts of friends and classmates","Threat to send the image to your family, college or employer by a deadline"],control_points:["Do not pay and do not reply. Save the messages, numbers and payment details, then block the account","Report on cybercrime.gov.in or call 1930; women can use the women-and-children section of the portal, including anonymously","Ask the platform to remove the content and report the profile; tell a trusted person so you are not isolated","Keep social profiles private and avoid sending photos or video calls to unverified recruiters"],rails:["UPI VPAs","Mule Accounts","Direct IMPS Transfers"],targets:["Young women","College students","Aspiring models and job seekers","Teachers"],media:{type:"audio",title:"Reconstructed Call \xB7 Fake Recruiter Turns Blackmailer",duration:58,transcript:[{time:0,speaker:"Scammer (Fake Recruiter)",text:"Hello, I am from a modelling and hiring agency. Please send a few photos and join a short video call so that we can shortlist you."},{time:14,speaker:"Victim",text:"I sent my photos and we had a short call. Why have you sent me this edited picture?"},{time:25,speaker:"Scammer (Blackmailer)",text:"I made this picture with AI from your photos. Pay \u20B930,000 or I will send it to your family and friends."},{time:38,speaker:"Victim",text:"Please delete it. I will pay, but do not send it to anyone."},{time:46,speaker:"Scammer (Blackmailer)",text:"Pay once more, and give me the numbers of your friends, or I will post it today."},{time:56,speaker:"Genuine Cyber Police Helpline",text:"Do not pay. Save the messages, block the number and report on 1930 or the cyber crime portal. You can report without giving your name."}],iocs:{sender_numbers:["+91 98XXX 21XXX (WhatsApp, unknown sender)"],profile_artifacts:["Fake recruiter or fake woman's account asking for photos","Instagram account created recently with few followers"],image_artifacts:["Real face with a generated body; inconsistent skin and edges","Screenshots from a video call used as source images"],payment_handles:["delete.image.fee@ybl (illustrative)","Acct: 9021XXXX3318 \xB7 IFSC FAKE0006042"]},legal_statutes:["BNS Sec 308 \xB7 351 (Extortion; criminal intimidation)","BNS Sec 79 (Word, gesture or act intended to insult the modesty of a woman)","BNS Sec 75 (Sexual harassment, including showing pornography against will)","IT Act Sec 66C \xB7 66D (Identity theft; cheating by personation)","IT Act Sec 66E \xB7 67 \xB7 67A (Violation of privacy; obscene and sexually explicit material)"]}},{id:"IN-024",vector:"Extortion",severity:"critical",title:"Ransomware on hospitals, schools and small businesses",summary:"Attackers get into a network through phishing or exposed remote access, encrypt files and servers, steal data, and demand payment in cryptocurrency. Services go back to paper or stop altogether while patient, student or customer data may be leaked.",red_flags:["Files suddenly renamed or unopenable, with a ransom note on screens and shared drives","Servers and billing or records systems down at once, often after a phishing email or a weak remote-desktop login","Demand to pay in bitcoin or USDT within days, with a threat to publish stolen data","Backups stored on the same network that are also encrypted or deleted"],control_points:["Isolate affected machines from the network at once, but do not wipe them; keep logs and the ransom note as evidence","Do not pay without advice; payment does not guarantee recovery. Report on cybercrime.gov.in and to CERT-In","Keep offline, tested backups, turn on multi-factor authentication and remove open remote-desktop access","Train staff on phishing and have an incident plan with phone numbers for IT, police and CERT-In"],rails:["P2P Cryptocurrency (USDT)","Mule Accounts"],targets:["Hospitals and clinics","Schools and colleges","Small and medium businesses","Local bodies"],media:{type:"audio",title:"Reconstructed Incident Call \xB7 Ransom Note and First Response",duration:58,transcript:[{time:0,speaker:"Scammer (Attacker Ransom Note, Read Aloud)",text:"All your files are encrypted. Your patient records and backups are in our hands. Pay in bitcoin within seventy two hours or the data will be published."},{time:14,speaker:"Victim (IT Manager)",text:"Our billing, laboratory and records systems are all locked. The front desk has gone back to paper."},{time:26,speaker:"Victim (IT Manager)",text:"Our backup drive is on the same network, and it is encrypted too."},{time:36,speaker:"Genuine CERT-In Responder",text:"Isolate the affected machines from the network, but do not wipe them. Keep the ransom note and the logs."},{time:48,speaker:"Genuine CERT-In Responder",text:"Do not rush to pay. Report the incident to us and on the cyber crime portal, and restore from clean offline backups."}],iocs:{ransom_artifacts:["README_DECRYPT.txt ransom note with an anonymous chat link (illustrative)","Renamed files with an added extension (illustrative)"],crypto_wallet:["BTC: bc1qXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX (masked)"],initial_access:["Phishing attachment opened by staff","Remote desktop open to the internet with a weak password"],impact_signs:["Servers offline, services in manual mode","Backups deleted or encrypted"]},legal_statutes:["IT Act Sec 43 \xB7 66 (Unauthorised access; computer related offences)","IT Act Sec 66F (Cyber terrorism; for attacks on critical information infrastructure)","IT Act Sec 70 (Protected systems)","BNS Sec 308 (Extortion)","BNS Sec 61 (Criminal conspiracy)","CERT-In Directions of 28 April 2022 (Duty to report specified cyber incidents within 6 hours)"]}},{id:"IN-025",vector:"Extortion",severity:"high",title:"Virtual kidnapping and 'your child is arrested' hoax calls to parents",summary:"Parents get a call, often on WhatsApp or from an international number, saying their son or daughter has been kidnapped, arrested or hurt in an accident. A crying voice or even a deepfaked video call is used, and the caller demands money at once and tells them not to call anyone.",red_flags:["Call from an unknown or foreign number about a serious crime, accident or kidnapping involving your child","A voice that sounds distressed but cannot answer a personal question, or a short deepfaked video","Instruction not to hang up or call anyone, and payment to a personal account within minutes","Calls timed when the child is unreachable, such as during exams, at night or in another time zone"],control_points:["Hang up and call your child directly, or the hostel, college or a friend, before paying anything","Do not send money to settle a 'case' or ransom over a call; real police do not demand cash on the phone","Agree a family code word, and note the number, time and account details if you are called","Report on 1930 and file at cybercrime.gov.in; banks can freeze the beneficiary account if told quickly"],rails:["UPI VPAs","IMPS / RTGS","Mule Accounts"],targets:["Parents of students","Families with children abroad","Senior citizens"],media:{type:"audio",title:"Reconstructed Call \xB7 'Your Son Is Arrested' Hoax",duration:52,transcript:[{time:0,speaker:"Scammer (Fake Police Officer)",text:"Madam, your son has been arrested in a serious case. He is with us at the police station right now."},{time:11,speaker:"Scammer (Fake Son Voice)",text:"Mummy, please do something. They will not release me."},{time:19,speaker:"Victim",text:"Beta, what happened? Let me talk to the officer."},{time:27,speaker:"Scammer (Fake Police Officer)",text:"The case can be closed and he can go home if you pay \u20B91.25 lakh now. Do not call anyone or the matter will get worse."},{time:40,speaker:"Victim",text:"I am sending the money now. Please do not hurt him."},{time:47,speaker:"Genuine Cyber Cell Officer",text:"Hang up and call your son directly or his hostel. These calls are scripted to stop you from checking."}],iocs:{caller_ids:["+9X XXXX XXXXXX (international number)","WhatsApp video call from an unknown number"],voice_artifacts:["Crying voice in the background","Cloned or deepfaked voice or video of the child"],payment_instructions:["Personal account or UPI ID given on the call","Demand within minutes, repeated in instalments"],mule_accounts:["Acct: 1180XXXX9042 \xB7 IFSC FAKE0009113"]},legal_statutes:["BNS Sec 308 \xB7 351 (Extortion; criminal intimidation)","BNS Sec 318(4) (Cheating)","BNS Sec 319(2) (Cheating by personation)","BNS Sec 204 (Personating a public servant)","IT Act Sec 66D (Cheating by personation using a computer resource)"]}},{id:"IN-026",vector:"Investment Fraud",severity:"critical",title:"Ponzi and MLM 'weekly returns' schemes disguised as jewellery or product plans",summary:"A retail brand or 'club' promises fixed weekly returns on purchases or deposits, pays early members from new members' money, and adds referral bonuses to recruit more. When recruitment slows, payments stop and the stores or offices close.",red_flags:["Fixed weekly or monthly returns of 6% or more on a purchase, voucher or 'cash-back' plan","Referral bonuses, gifts, cars or flats for bringing in new investors","Showrooms or offices that look real but have no registered deposit-taking licence","Payouts that start to slip, with a promise that recruiting more members will clear your payment first"],control_points:["Treat any promise of fixed high returns as a warning; banks, NBFCs and SEBI-registered firms cannot guarantee them","Check whether the firm is allowed to take deposits on the RBI and SEBI websites and ask for the registration number","Stop investing and do not recruit others; file a complaint with the Economic Offences Wing and, for online payments, on 1930","Report suspected unauthorised deposit schemes to the state police EOW and through the RBI Sachet portal"],rails:["UPI VPAs","Cash","RTGS / NEFT","Mule Accounts"],targets:["Small traders and vendors","Lower- and middle-income savers","Homemakers and retirees"],media:{type:"audio",title:"Reconstructed Pitch \xB7 Weekly-return Jewellery Cash-back Plan",duration:58,transcript:[{time:0,speaker:"Scammer (Fake Plan Promoter)",text:"Our jewellery cash-back plan pays six to eleven percent every week. Invest \u20B91 lakh, buy the vouchers, and bring five friends for referral bonuses."},{time:14,speaker:"Victim",text:"Is it safe? Who regulates these weekly returns?"},{time:22,speaker:"Scammer (Fake Plan Promoter)",text:"We have six showrooms and thousands of members. Early members are earning every week. The seats close this week."},{time:35,speaker:"Victim",text:"My payments have stopped for two weeks. The showroom is closed today."},{time:43,speaker:"Scammer (Fake Plan Promoter)",text:"There is a short delay because of an audit. Bring more members and your payout will be cleared first."},{time:54,speaker:"Genuine EOW Officer",text:"Weekly returns on purchases are a warning sign. Stop investing, do not recruit anyone, and file a complaint with the Economic Offences Wing."}],iocs:{scheme_artifacts:["Weekly return table of 6% to 20% on purchase vouchers","Referral bonus ladder and gift hampers"],premises:["Showrooms in several suburbs closed on the same day","Rented offices with a new company name"],payment_pattern:["Cash and UPI deposits to company and personal accounts","Funds sent abroad through unlawful channels"],recruiter_handles:["WhatsApp groups named after the plan with 'seats closing' messages"]},legal_statutes:["BNS Sec 318(4) (Cheating)","BNS Sec 316 (Criminal breach of trust)","BNS Sec 61 \xB7 111 (Criminal conspiracy; organised crime)","Banning of Unregulated Deposit Schemes Act, 2019 (Unregulated deposit schemes)","Maharashtra Protection of Interest of Depositors Act, 1999 (State law, as applied in Maharashtra cases)","Prize Chits and Money Circulation Schemes (Banning) Act, 1978 (Pyramid and money circulation schemes)","Prevention of Money Laundering Act, 2002 Sec 3 (Laundering of proceeds)"]}},{id:"IN-027",vector:"Investment Fraud",severity:"critical",title:"Fake IPO pre-allotment and 'institutional desk' WhatsApp groups",summary:"Victims are added to WhatsApp or Telegram groups named after famous brokers or institutions and told that a foreign-investor quota can give them pre-allotment of an upcoming IPO. A fake app shows large allotments and profits, then demands more money to confirm the allotment or to lift the 'account rating'.",red_flags:["Unsolicited group invitation named after a well-known broker, with 'Madam' or 'Professor' as the mentor","Promise of IPO pre-allotment, block deals or an FPI quota that ordinary investors cannot get","Trading app installed from an APK or link that is not from the broker's official site","Withdrawals blocked with demands for a 'confirmation payment', 'tax' or a higher 'account rating'"],control_points:["Verify every broker, adviser and app on the SEBI website; registered intermediaries do not cold-add you to groups","Apply for IPOs only through your own demat and UPI mandate with a registered broker or bank","Never pay to withdraw your own money; stop, save the chats and call 1930 within the first hours","Banks should flag new current accounts that receive repeated large first-time transfers from retail customers"],rails:["RTGS / NEFT","UPI VPAs","Mule Current Accounts","Sideloaded APKs"],targets:["Retail investors","Retirees","Salaried professionals","Homemakers"],media:{type:"audio",title:"Reconstructed Group Call \xB7 Fake Institutional Desk and IPO Allotment",duration:58,transcript:[{time:0,speaker:"Scammer (Fake Fund Manager)",text:"Welcome to the institutional desk group. Our foreign investor quota gets pre-allotment of the upcoming IPO at a discount. Download our trading app with my invitation code."},{time:15,speaker:"Victim",text:"I deposited \u20B93 lakh. The app shows an allotment and a good profit."},{time:25,speaker:"Scammer (Fake Fund Manager)",text:"A very large allotment has come in. To confirm it, deposit \u20B964 lakh within two days or the allotment will be cancelled."},{time:38,speaker:"Victim",text:"I cannot withdraw even my \u20B93 lakh. The app says my account rating is low."},{time:47,speaker:"Scammer (Fake Fund Manager)",text:"Pay more to raise the rating. If you leave the group, you will lose everything."},{time:56,speaker:"Genuine Cyber Police Officer",text:"No registered broker gives pre-allotment through a WhatsApp group. Stop paying, save the chats, check the broker on the SEBI list
